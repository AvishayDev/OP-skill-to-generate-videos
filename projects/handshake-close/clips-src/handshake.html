<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Heebo; font-weight: 800; src: url('file:///opt/node22/lib/node_modules/reelkit-cli/node_modules/@fontsource/heebo/files/heebo-hebrew-800-normal.woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Handshake → app icon. Two hands reach in on an arc, slow down, slide palm to palm; the left
// fingers wrap round the right hand one after another while the right thumb closes over the top;
// a squeeze, two damped pumps, then the grip settles into the exact pose of the app icon, the
// tile grows in behind and the drawn hands dissolve into the icon artwork (icon.png).
// Everything is authored in icon space (1024 × 1024, the icon's own pixels).
const W = 1080, H = 1920, DURATION = 3.2;
const BG_TOP = '#59acfb', BG_BOT = '#4195f4', LINE = '#2b4c9c', OW = 3.6; // navy lines like the icon
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lx = layer.getContext('2d');
const icon = new Image(); icon.src = 'icon.png';
const tile = new Image(); tile.src = 'tile.png';

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, k) => a + (b - a) * k;
const span = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOutBack = (k, s = 1.5) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);

// ---------- one hand, local space: wrist at (0,0), pointing +x, thumb side up (y < 0) ----------
// Proportions follow a real hand: palm ≈ finger length, middle finger longest, phalanges ≈ 1 : .62 : .5.
const FINGERS = { // bottom (pinky) first so the upper fingers overlap the lower ones
  pinky:  { x: 140, y: 54,  seg: [48, 30, 25], w: [38, 31], fan: 0.1 },
  ring:   { x: 156, y: 22,  seg: [60, 37, 30], w: [43, 35], fan: 0.04 },
  middle: { x: 162, y: -10, seg: [65, 41, 33], w: [45, 37], fan: 0.0 },
  index:  { x: 156, y: -42, seg: [60, 37, 30], w: [43, 35], fan: -0.04 },
};
const ORDER = ['pinky', 'ring', 'middle', 'index'];

function chain(x, y, segs, angles) {
  const pts = [[x, y]]; let a = 0;
  segs.forEach((len, i) => { a += angles[i]; x += Math.cos(a) * len; y += Math.sin(a) * len; pts.push([x, y]); });
  return pts;
}
// Tapered finger outline along a joint chain, rounded tip. Open at the base (it sits in the palm).
function limbPath(g, pts, w0, w1, from = 0) {
  const n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    const nx = -dy / d, ny = dx / d, hw = mix(w0, w1, i / (n - 1)) / 2;
    // slight knuckle bulge at the joints
    const bulge = i > 0 && i < n - 1 ? 1.06 : 1;
    L.push([pts[i][0] + nx * hw * bulge, pts[i][1] + ny * hw * bulge]);
    R.push([pts[i][0] - nx * hw * bulge, pts[i][1] - ny * hw * bulge]);
  }
  const tip = pts[n - 1], prev = pts[n - 2], ta = Math.atan2(tip[1] - prev[1], tip[0] - prev[0]);
  const s = from; // start index (fractional: skip part of the first segment)
  const lerpP = (A, i) => { const i0 = Math.floor(i), f = i - i0; return i0 >= n - 1 ? A[n - 1] : [mix(A[i0][0], A[i0 + 1][0], f), mix(A[i0][1], A[i0 + 1][1], f)]; };
  const smooth = (A, startI, reverse) => {
    const idx = []; for (let i = Math.ceil(startI); i < n; i++) idx.push(i);
    const seq = [lerpP(A, startI), ...idx.filter((i) => i > startI).map((i) => A[i])];
    if (reverse) seq.reverse();
    return seq;
  };
  const left = smooth(L, s, false), right = smooth(R, s, true);
  g.beginPath(); g.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length - 1; i++) { const m = [(left[i][0] + left[i + 1][0]) / 2, (left[i][1] + left[i + 1][1]) / 2]; g.quadraticCurveTo(left[i][0], left[i][1], m[0], m[1]); }
  g.lineTo(left[left.length - 1][0], left[left.length - 1][1]);
  g.arc(tip[0], tip[1], w1 / 2, ta + Math.PI / 2, ta - Math.PI / 2, true);
  for (let i = 1; i < right.length - 1; i++) { const m = [(right[i][0] + right[i + 1][0]) / 2, (right[i][1] + right[i + 1][1]) / 2]; g.quadraticCurveTo(right[i][0], right[i][1], m[0], m[1]); }
  g.lineTo(right[right.length - 1][0], right[right.length - 1][1]);
}
function palmPath(g) {
  g.beginPath();
  g.moveTo(-14, -80);
  g.bezierCurveTo(40, -92, 90, -84, 134, -66);   // back of the hand rising to the index knuckle
  g.bezierCurveTo(168, -54, 182, -30, 182, -4);  // knuckles
  g.bezierCurveTo(182, 30, 172, 58, 148, 74);    // pinky knuckle
  g.bezierCurveTo(100, 94, 40, 94, -14, 80);     // heel of the palm
  g.closePath();
}
function skin(g) {
  const gr = g.createLinearGradient(0, -100, 0, 120);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#cfe3ff');
  return gr;
}
function crease(g, pts, i, w) {
  // short crease across the finger at joint i (knuckle line), like the skin folds on a real hand
  const a = pts[i - 1], b = pts[i + 1] ?? pts[i], p = pts[i];
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
  g.beginPath();
  g.moveTo(p[0] + nx * w * 0.22, p[1] + ny * w * 0.22);
  g.quadraticCurveTo(p[0] + dx / d * 3, p[1] + dy / d * 3, p[0] - nx * w * 0.22, p[1] - ny * w * 0.22);
  g.lineWidth = 3; g.strokeStyle = 'rgba(43,76,156,0.3)'; g.lineCap = 'round'; g.stroke();
}
// pose: { curl: {pinky..index: 0..1}, curlMax: radians of total curl, thumb: [a0, a1] }
function fingerPts(name, pose) {
  const f = FINGERS[name], c = pose.curl[name], m = pose.curlMax;
  return chain(f.x, f.y, f.seg.map((l) => l * (pose.len ?? 1)), [f.fan + c * m * 0.34 + 0.03, c * m * 0.38 + 0.04, c * m * 0.28 + 0.03]);
}
function thumbPts(pose) { return chain(30, -60, [pose.thumbLen?.[0] ?? 64, pose.thumbLen?.[1] ?? 54], [pose.thumb[0], pose.thumb[1]]); }

function drawPalm(g, pose, withFingers) {
  const S = skin(g);
  const fp = withFingers ? ORDER.map((n) => [n, fingerPts(n, pose)]) : [];
  // A: one outline for the whole silhouette   B: fill   C: separations, upper fingers over lower
  palmPath(g); g.lineWidth = OW * 2; g.strokeStyle = LINE; g.lineJoin = 'round'; g.stroke();
  fp.forEach(([n, p]) => { limbPath(g, p, ...FINGERS[n].w); g.stroke(); });
  palmPath(g); g.fillStyle = S; g.fill();
  fp.forEach(([n, p]) => { limbPath(g, p, ...FINGERS[n].w); g.fill(); });
  fp.forEach(([n, p], i) => {
    if (i > 0) { limbPath(g, p, ...FINGERS[n].w, 0.55); g.lineWidth = OW * 2; g.stroke(); g.fill(); }
    crease(g, p, 2, FINGERS[n].w[1]);
  });
}
function drawFingers(g, pose, names, from = 0) {
  const S = skin(g);
  names.forEach((n) => { const p = fingerPts(n, pose); limbPath(g, p, ...FINGERS[n].w, from); g.lineWidth = OW * 2; g.strokeStyle = LINE; g.stroke(); g.fillStyle = S; g.fill(); crease(g, p, 2, FINGERS[n].w[1]); });
}
function drawThumb(g, pose) {
  const S = skin(g), p = thumbPts(pose);
  // the thumb grows out of the fleshy pad at the base of the palm
  const [tw0, tw1] = pose.thumbW ?? [52, 36];
  limbPath(g, p, tw0, tw1); g.lineWidth = OW * 2; g.strokeStyle = LINE; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = S; g.fill();
  g.beginPath(); g.ellipse(40, -54, 40, 26, -0.15, 0, Math.PI * 2); g.fill();
  crease(g, p, 1, 46);
}
function roundedPoly(g, P, r) {
  g.beginPath();
  P.forEach((p, i) => {
    const a = P[(i + P.length - 1) % P.length], b = P[(i + 1) % P.length];
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const p0 = [p[0] + (a[0] - p[0]) * r / da, p[1] + (a[1] - p[1]) * r / da], p1 = [p[0] + (b[0] - p[0]) * r / db, p[1] + (b[1] - p[1]) * r / db];
    if (i === 0) g.moveTo(p0[0], p0[1]); else g.lineTo(p0[0], p0[1]);
    g.quadraticCurveTo(p[0], p[1], p1[0], p1[1]);
  });
  g.closePath();
}
function drawCuff(g, quad) {
  roundedPoly(g, quad, 14);
  const ys = quad.map((p) => p[1]);
  const gr = g.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys)); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#c4dcff');
  g.fillStyle = gr; g.fill(); g.lineWidth = OW * 2; g.strokeStyle = LINE; g.stroke();
}
const HS = 1.2; // hand size relative to the cuffs
function inHand(g, h, fn, k = HS) { g.save(); g.translate(h.x, h.y); if (h.mirror) g.scale(-1, 1); g.rotate(h.rot); g.scale(k, k); fn(); g.restore(); }

// ---------- the final grip = the icon's pose (icon space) ----------
const GRIP = {
  left:  { x: 316, y: 534, rot: 0.42 },
  right: { x: 708, y: 534, rot: 0.42 },
};
// measured from icon.png: the cuffs' corners and the four burst lines (inner end → outer end)
const CUFF_ICON = {
  left: [[240, 382], [347, 436], [262, 658], [196, 636]],
  right: [[784, 382], [828, 636], [762, 660], [677, 436]],
};
const BURST = [[[398.6, 342.6], [361.9, 287.4]], [[476.8, 328.4], [463.1, 224.8]], [[555.2, 328.4], [569.1, 224.9]], [[633.7, 342.5], [670.4, 278.1]]];
// the cuff quads in each hand's local space (inverse of the grip transform), so they travel with the hands
const toLocal = (h, mirror, [x, y]) => {
  const dx = x - h.x, dy = y - h.y, c = Math.cos(-h.rot), s = Math.sin(-h.rot);
  const mx = mirror ? -dx : dx;
  return [mx * c - dy * s, mx * s + dy * c];
};
const CUFF = { left: CUFF_ICON.left.map((p) => toLocal(GRIP.left, false, p)), right: CUFF_ICON.right.map((p) => toLocal(GRIP.right, true, p)) };

function frame(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, BG_TOP); bg.addColorStop(1, BG_BOT);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.5, 1200);
  vg.addColorStop(0, 'rgba(255,255,255,0.06)'); vg.addColorStop(1, 'rgba(10,40,120,0.12)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // ---- timing ----
  const reachL = easeOut(span(t, 0.08, 0.86));
  const reachR = easeOut(span(t, 0.14, 0.9));
  const slide = easeInOut(span(t, 0.8, 1.08));
  const grip = span(t, 0.92, 1.36);
  const thumbK = easeInOut(span(t, 0.98, 1.32));
  const squeeze = Math.sin(Math.PI * span(t, 1.26, 1.44));
  const settle = easeInOut(span(t, 1.92, 2.24));
  const pumpT = t - 1.4;
  const pump = (pumpT > 0 ? Math.sin(2 * Math.PI * 2.1 * pumpT) * Math.exp(-pumpT * 2.6) : 0) * (1 - settle);
  const tileK = window.DEBUG_RIG ? 0 : span(t, 2.1, 2.4);
  const iconK = window.DEBUG_RIG ? 0 : easeInOut(span(t, 2.26, 2.44));

  // icon space → screen
  const s = mix(1.1, 0.664, settle), cx = W / 2, cy = mix(930, 900, settle) + pump * 30;
  const toScreen = (g) => { g.translate(cx, cy); g.scale(s, s * (1 - 0.03 * squeeze)); g.translate(-512, -512); };

  // hands: arc in from below-outside, palms turning upright as they come
  const out = 60; // extra distance before sliding in
  const L = {
    x: mix(-760, GRIP.left.x - out, reachL) + out * slide,
    y: GRIP.left.y + mix(300, 0, easeOut(span(t, 0.08, 0.7))) - 40 * Math.sin(Math.PI * reachL) * (1 - reachL),
    rot: mix(-0.35, GRIP.left.rot - 0.1, reachL) + 0.1 * slide + pump * 0.05,
  };
  const R = {
    mirror: true,
    x: mix(1784, GRIP.right.x + out, reachR) - out * slide,
    y: GRIP.right.y + mix(320, 0, easeOut(span(t, 0.14, 0.76))) - 40 * Math.sin(Math.PI * reachR) * (1 - reachR),
    rot: mix(-0.35, GRIP.right.rot - 0.1, reachR) + 0.1 * slide + pump * 0.05,
  };
  // staggered curl: index first, pinky last
  const stag = (d) => easeInOut(clamp(grip * 1.25 - d));
  const leftPose = { curlMax: 0.4, len: 1.15, curl: { index: stag(0), middle: stag(0.06), ring: stag(0.12), pinky: stag(0.18) }, thumb: [mix(-0.85, -0.3, thumbK), mix(-0.15, 0.25, thumbK)] };
  const rightPose = { curlMax: 0.45, len: 1.1, thumbW: [64, 50], curl: { index: stag(0.04), middle: stag(0.12), ring: stag(0.2), pinky: stag(0.28) }, thumbLen: [92, 78], thumb: [mix(-0.85, -0.3, thumbK), mix(-0.15, 0.22, thumbK)] };
  const open = { index: 0.05, middle: 0.05, ring: 0.06, pinky: 0.08 };
  for (const k in open) { leftPose.curl[k] = Math.max(open[k], leftPose.curl[k]); rightPose.curl[k] = Math.max(open[k], rightPose.curl[k]); }

  lx.clearRect(0, 0, W, H);
  lx.save(); toScreen(lx);
  // back → front: left thumb, left hand, right hand, right thumb, left fingertips wrapping round, cuffs
  // the icon's layering: left palm at the back, right hand and its fingertips curling under at the
  // bottom-left, the left fingers lying across the back of the right hand, the right thumb on top
  inHand(lx, L, () => drawThumb(lx, leftPose));
  inHand(lx, L, () => drawPalm(lx, leftPose, false));
  inHand(lx, R, () => drawPalm(lx, rightPose, true));
  inHand(lx, L, () => drawFingers(lx, leftPose, ORDER, 0));
  inHand(lx, R, () => drawThumb(lx, rightPose));
  inHand(lx, L, () => drawCuff(lx, CUFF.left), 1);
  inHand(lx, R, () => drawCuff(lx, CUFF.right), 1);
  lx.restore();

  // tile grows in behind the hands
  if (tileK > 0) {
    const k = easeOutBack(tileK, 1.1), ts = s * mix(0.7, 1, k);
    ctx.save(); ctx.globalAlpha = Math.min(1, tileK * 2.5);
    ctx.shadowColor = 'rgba(16,58,150,0.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 22;
    ctx.translate(cx, cy); ctx.scale(ts, ts); ctx.drawImage(tile, -512, -512, 1024, 1024);
    ctx.restore();
  }
  // ring pulse on the squeeze
  const ring = span(t, 1.28, 1.85);
  if (ring > 0 && ring < 1) {
    ctx.beginPath(); ctx.arc(cx, cy, mix(180, 380, easeOut(ring)) * s, 0, Math.PI * 2);
    ctx.lineWidth = 6; ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - ring)})`; ctx.stroke();
  }
  // hands
  ctx.save(); ctx.globalAlpha = 1 - iconK;
  ctx.shadowColor = `rgba(22,50,135,${0.5 * (1 - tileK)})`; ctx.shadowBlur = 60 * s; ctx.shadowOffsetY = 8 * s;
  ctx.drawImage(layer, 0, 0); ctx.restore();
  // burst lines land exactly where the icon has them
  ctx.save(); toScreen(ctx); ctx.globalAlpha = 1 - iconK;
  BURST.forEach(([a, b], i) => {
    const k = span(t, 1.32 + i * 0.05, 1.62 + i * 0.05);
    if (k <= 0) return;
    const e = easeOutBack(k), off = (1 - Math.min(1, k * 1.6)) * 40; // shoots out from the hands
    const ux = (b[0] - a[0]), uy = (b[1] - a[1]), ul = Math.hypot(ux, uy);
    const ax = a[0] - ux / ul * off, ay = a[1] - uy / ul * off;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mix(ax, b[0], e), mix(ay, b[1], e));
    ctx.lineWidth = 40; ctx.lineCap = 'round'; ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, k * 2)})`; ctx.stroke();
  });
  ctx.restore();
  // the icon itself
  if (iconK > 0) {
    ctx.save(); ctx.globalAlpha = iconK; ctx.translate(cx, cy); ctx.scale(s, s);
    ctx.drawImage(icon, -512, -512, 1024, 1024); ctx.restore();
  }
  if (window.DEBUG_OVERLAY) { ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(cx, cy); ctx.scale(s, s); ctx.drawImage(icon, -512, -512, 1024, 1024); ctx.restore(); }

  // caption
  const tk = easeOut(span(t, 2.3, 2.62));
  if (tk > 0) {
    ctx.save(); ctx.globalAlpha = tk; ctx.font = '800 92px Heebo'; ctx.textAlign = 'center'; ctx.direction = 'rtl';
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(16,58,150,0.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
    ctx.fillText('קבענו את זה!', W / 2, 1340 + 30 * (1 - tk)); ctx.restore();
  }
}
window.DURATION = DURATION; window.frame = frame;
const loaded = (img) => new Promise((r) => (img.complete ? r() : (img.onload = r)));
window.ready = Promise.all([document.fonts.load("800 92px Heebo", 'קבענו'), loaded(icon), loaded(tile)]).then(() => true);
</script>
