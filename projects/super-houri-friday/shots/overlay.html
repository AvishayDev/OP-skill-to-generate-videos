<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--cream:#FFF6E6;--choc:#3A1C10;--rasp:#E5336B;--gold:#FFC23D;--mint:#7FD8BE}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0}
.el{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;white-space:nowrap}
.giant{font-family:'Secular One';font-size:250px;line-height:1;color:var(--cream);
  -webkit-text-stroke:14px var(--choc);paint-order:stroke fill;letter-spacing:-4px;
  text-shadow:0 14px 0 var(--choc)}
.chip{font-family:'Rubik';font-weight:800;font-size:76px;color:var(--choc);background:var(--cream);
  border:7px solid var(--choc);border-radius:999px;padding:14px 46px 20px;box-shadow:0 12px 0 var(--choc)}
.chip.r{background:var(--rasp);color:#fff}
.chip.g{background:var(--gold)}
.chip.m{background:var(--mint)}
.small{font-family:'Rubik';font-weight:800;font-size:54px;color:var(--choc);background:var(--gold);
  border:6px solid var(--choc);border-radius:22px;padding:8px 28px 12px;box-shadow:0 9px 0 var(--choc)}
.ribbon{font-family:'Secular One';font-size:132px;color:#fff;background:var(--rasp);
  border:8px solid var(--choc);border-radius:28px;padding:6px 54px 22px;box-shadow:0 14px 0 var(--choc)}
.tag{width:440px;height:520px}
.tagtxt{position:absolute;left:0;right:0;text-align:center;font-family:'Rubik';color:var(--choc)}
.badge{width:560px;height:560px}
.clock{width:300px;height:300px}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- easing ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const outBack=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const outCubic=x=>1-Math.pow(1-clamp(x),3);
const inCubic=x=>Math.pow(clamp(x),3);
const spring=x=>{x=Math.max(0,x);return 1-Math.exp(-6*x)*Math.cos(11*x)}; // overshooting settle
const lerp=(a,b,t)=>a+(b-a)*t;

// ---------- svg pieces ----------
const donut=`<svg viewBox="0 0 200 200" width="190" height="190">
 <circle cx="100" cy="104" r="86" fill="#3A1C10"/>
 <circle cx="100" cy="96" r="86" fill="#E9A85B"/>
 <path d="M28 92c4-40 36-66 72-66s70 26 72 66c-10 18-26 8-34 22-8 14-24 4-38 14-14-10-30 0-38-14-8-14-24-4-34-22z" fill="#E5336B"/>
 <circle cx="100" cy="96" r="26" fill="#3A1C10"/><circle cx="100" cy="92" r="24" fill="#FFF6E6" opacity="0"/>
 <g stroke-linecap="round" stroke-width="7"><path d="M60 62l10 6" stroke="#FFC23D"/><path d="M130 52l-6 10" stroke="#fff"/><path d="M146 86l-11 2" stroke="#7FD8BE"/><path d="M70 104l-10 4" stroke="#fff"/><path d="M98 50l2 11" stroke="#7FD8BE"/><path d="M126 116l9 6" stroke="#FFC23D"/></g>
</svg>`;
const heart=(c='#E5336B',s=90)=>`<svg viewBox="0 0 100 92" width="${s}" height="${s*0.92}"><path d="M50 88C20 66 4 50 4 30 4 14 16 4 30 4c9 0 16 5 20 12 4-7 11-12 20-12 14 0 26 10 26 26 0 20-16 36-46 58z" fill="${c}" stroke="#3A1C10" stroke-width="6"/></svg>`;
const spark=(c='#FFC23D',s=70)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><path d="M50 2C54 36 64 46 98 50 64 54 54 64 50 98 46 64 36 54 2 50 36 46 46 36 50 2z" fill="${c}" stroke="#3A1C10" stroke-width="5"/></svg>`;
const pin=`<svg viewBox="0 0 60 80" width="46" height="62" style="vertical-align:-10px;margin-left:12px"><path d="M30 76C12 50 4 38 4 26a26 26 0 0152 0c0 12-8 24-26 50z" fill="#E5336B" stroke="#3A1C10" stroke-width="6"/><circle cx="30" cy="26" r="9" fill="#fff"/></svg>`;
const candle=(id)=>`<svg viewBox="0 0 80 220" width="80" height="220"><rect x="22" y="80" width="36" height="130" rx="6" fill="#FFF6E6" stroke="#3A1C10" stroke-width="6"/><path d="M40 80v-14" stroke="#3A1C10" stroke-width="5"/><path id="${id}" d="M40 10C52 30 54 44 40 62 26 44 28 30 40 10z" fill="#FFC23D" stroke="#E5336B" stroke-width="4"/></svg>`;
const cake=`<svg viewBox="0 0 200 170" width="170" height="145"><rect x="20" y="70" width="160" height="88" rx="14" fill="#E9A85B" stroke="#3A1C10" stroke-width="7"/><path d="M20 92c20 14 30-6 50 6s30-8 50 4 40-10 60 2V84c0-8-6-14-14-14H34c-8 0-14 6-14 14z" fill="#FFF6E6" stroke="#3A1C10" stroke-width="6"/><rect x="20" y="112" width="160" height="12" fill="#E5336B"/><circle cx="100" cy="52" r="16" fill="#E5336B" stroke="#3A1C10" stroke-width="6"/><path d="M100 36c4-10 12-14 18-14" stroke="#3A1C10" stroke-width="5" fill="none"/></svg>`;
const tagSvg=(fill)=>`<svg viewBox="0 0 440 520" width="440" height="520" style="position:absolute;inset:0">
 <path d="M220 0v70" stroke="#3A1C10" stroke-width="7"/>
 <path d="M50 130 L220 50 L390 130 V470 Q390 500 360 500 H80 Q50 500 50 470Z" fill="#3A1C10" transform="translate(0,14)"/>
 <path d="M50 130 L220 50 L390 130 V470 Q390 500 360 500 H80 Q50 500 50 470Z" fill="${fill}" stroke="#3A1C10" stroke-width="8"/>
 <circle cx="220" cy="110" r="18" fill="#FFF6E6" stroke="#3A1C10" stroke-width="7"/></svg>`;
const badgeSvg=()=>{let p='';const n=16;for(let i=0;i<n*2;i++){const r=i%2?230:270,a=Math.PI*i/n;p+=(i?'L':'M')+(280+r*Math.cos(a)).toFixed(1)+' '+(280+r*Math.sin(a)).toFixed(1)}
 return `<svg viewBox="0 0 560 560" width="560" height="560" style="position:absolute;inset:0"><path d="${p}Z" fill="#3A1C10" transform="translate(0,16)"/><path d="${p}Z" fill="#FFC23D" stroke="#3A1C10" stroke-width="9"/><circle cx="280" cy="280" r="190" fill="none" stroke="#3A1C10" stroke-width="6" stroke-dasharray="4 16" stroke-linecap="round"/></svg>`};
const clockSvg=`<svg viewBox="0 0 300 300" width="300" height="300"><circle cx="150" cy="158" r="130" fill="#3A1C10"/><circle cx="150" cy="150" r="130" fill="#FFF6E6" stroke="#3A1C10" stroke-width="10"/>
 ${[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<line x1="${150+104*Math.sin(a)}" y1="${150-104*Math.cos(a)}" x2="${150+116*Math.sin(a)}" y2="${150-116*Math.cos(a)}" stroke="#3A1C10" stroke-width="${i%3?5:9}" stroke-linecap="round"/>`}).join('')}
 <line id="hh" x1="150" y1="150" x2="150" y2="85" stroke="#3A1C10" stroke-width="14" stroke-linecap="round"/>
 <line id="mh" x1="150" y1="150" x2="150" y2="54" stroke="#E5336B" stroke-width="9" stroke-linecap="round"/>
 <circle cx="150" cy="150" r="12" fill="#3A1C10"/></svg>`;

// ---------- elements ----------
// each: layer B (behind the person) or F (front), t0/t1 window, x/y = centre, html, anim(local, el) -> {s, r, dx, dy, o}
const E=[];
function add(o){E.push(Object.assign({layer:'F',x:540,y:400,r0:0,exit:0.22},o))}
// pop in at t0 with back easing, settle, pop out before t1
const pop=(d=0.38)=>(t,e)=>{const i=outBack(t/d),o=1-inCubic((t-(e.t1-e.t0-e.exit))/e.exit);return{s:Math.min(i,1+0*o)*lerp(0.55,1,o)+0,o:clamp(Math.min(t/0.08,o)),r:e.r0*(1-outCubic(t/0.5))+e.wob*Math.sin(t*2.4)}};
function popA(d=0.38){return (t,e)=>{const tin=clamp(t/d),tout=clamp((t-(e.t1-e.t0-e.exit))/e.exit);
  const s=outBack(tin)*(1-0.6*inCubic(tout));return{s,o:clamp(t/0.06)*(1-inCubic(tout)),r:(e.r0||0)*(1-outCubic(tin))+(e.wob||0)*Math.sin(t*2.6),dy:(e.float||0)*Math.sin(t*1.8)}}}
function slide(from=-1,d=0.45){return (t,e)=>{const tin=clamp(t/d),tout=clamp((t-(e.t1-e.t0-e.exit))/e.exit);
  return{s:1,dx:from*900*(1-outCubic(tin))-from*900*inCubic(tout),o:1,r:(e.wob||0)*Math.sin(t*2.6)}}}
function swing(d=0.9){return (t,e)=>{const tin=clamp(t/0.4),tout=clamp((t-(e.t1-e.t0-e.exit))/e.exit);
  return{s:1,dy:-900*(1-outCubic(tin))-1000*inCubic(tout),r:18*Math.exp(-2.6*t)*Math.sin(7*t)+1.5*Math.sin(t*2),o:1,origin:'50% 0%'}}}
function slam(){return (t,e)=>{const tin=clamp(t/0.22),tout=clamp((t-(e.t1-e.t0-e.exit))/e.exit);
  const s=t<0.22?lerp(2.6,1,inCubic(tin)):1+0.08*Math.exp(-8*(t-0.22))*Math.sin(30*(t-0.22));
  return{s:s*(1-0.7*inCubic(tout)),o:clamp(t/0.05)*(1-inCubic(tout)),r:(e.r0||0)+(e.wob||0)*Math.sin(t*2)}}}

// 1  intro — giant behind Daniel's head
add({layer:'B',t0:0.05,t1:2.05,x:540,y:300,html:`<div class="giant" style="font-size:200px">שישי שמח</div>`,anim:popA(0.45),r0:-8,wob:1.2});
add({t0:0.25,t1:2.0,x:150,y:150,html:spark('#FFC23D',90),anim:popA(0.3),r0:-90,wob:10});
add({t0:0.45,t1:2.0,x:960,y:520,html:spark('#7FD8BE',70),anim:popA(0.3),r0:90,wob:-12});
// hearts for "לקוחות וחברים יקרים"
[[180,980,1.12,'#E5336B',110],[880,1060,1.3,'#FFC23D',90],[300,1180,1.5,'#E5336B',80]].forEach(([x,y,t,c,s],i)=>
  add({t0:t,t1:2.05,x,y,html:heart(c,s),anim:(lt,e)=>({s:outBack(lt/0.3),o:1-inCubic((lt-(e.t1-e.t0-0.2))/0.2),dy:-120*lt,r:12*Math.sin(lt*5+i)})}));
// name card
add({t0:2.0,t1:4.1,x:700,y:1060,html:`<div class="chip r" style="font-size:96px">דניאל</div>`,anim:popA(),r0:10,wob:1.5});
add({t0:3.02,t1:4.1,x:640,y:1215,html:`<div class="chip g" style="font-size:66px">סופר חורי</div>`,anim:popA(),r0:-8,wob:-1.5});
add({t0:3.66,t1:4.1,x:330,y:1110,html:`<div class="small" style="background:#FFF6E6">${pin}שדרות</div>`,anim:popA(0.3),r0:12,exit:0.15});

// 2  the doughnuts
add({t0:4.2,t1:5.95,x:540,y:300,html:`<div class="ribbon">הסופגניות</div>`,anim:slide(1),wob:1.2});
add({t0:5.19,t1:5.95,x:560,y:470,html:`<div class="small" style="font-size:64px">המיוחדות שלנו</div>`,anim:popA(0.3),r0:-6,exit:0.15});
add({t0:4.35,t1:5.95,x:880,y:150,html:donut,anim:(t,e)=>({s:outBack(t/0.4)*(1-inCubic((t-1.4)/0.2)),r:-200*(1-outCubic(t/0.6))+8*Math.sin(t*3)})});
// flavours, one per word
const fl=[['שוקולד לבן',6.13,'',700,260,-4],['עוגיות',6.81,'g',340,420,5],['לוטוס',7.43,'r',740,580,-5],['אלפחורס',7.75,'m',360,740,4],['ריבת חלב',8.73,'g',660,900,-3]];
fl.forEach(([w,t,c,x,y,r])=>add({t0:t,t1:9.0,x,y,html:`<div class="chip ${c}">${w}</div>`,anim:popA(0.34),r0:r*4,wob:r*0.35,exit:0.18}));
const fl2=[['קינדר',9.11,'r',540,330,-4],['בלי ריבה',10.01,'',330,520,5],['עם ריבה',10.49,'g',730,700,-5]];
fl2.forEach(([w,t,c,x,y,r])=>add({t0:t,t1:11.08,x,y,html:`<div class="chip ${c}" style="font-size:90px">${w}</div>`,anim:popA(0.34),r0:r*4,wob:r*0.35,exit:0.18}));
// best in the country
add({t0:11.15,t1:12.6,x:540,y:560,html:`<div class="badge">${badgeSvg()}<div class="tagtxt" style="top:150px;font-weight:800;font-size:62px">הסחורה</div><div class="tagtxt" style="top:214px;font-family:'Secular One';font-size:116px;line-height:1">הכי טובה</div><div class="tagtxt" style="top:330px;font-family:'Secular One';font-size:100px;color:#E5336B">בארץ!</div></div>`,anim:slam(),r0:-8,wob:2});
add({t0:11.75,t1:12.6,x:200,y:330,html:spark('#fff',90),anim:popA(0.25),r0:120,wob:15,exit:0.15});
add({t0:11.85,t1:12.6,x:880,y:800,html:spark('#E5336B',80),anim:popA(0.25),r0:-120,wob:-15,exit:0.15});
// shabbat shalom
add({t0:12.61,t1:14.15,x:540,y:250,html:`<div class="ribbon" style="background:#3A1C10;color:#FFC23D;border-color:#FFC23D">שבת שלום</div>`,anim:popA(0.4),r0:-6,wob:1});
add({t0:12.8,t1:14.15,x:130,y:520,html:`<div style="transform:scale(1.7)">${candle('f1')}</div>`,anim:popA(0.35),flame:'f1'});
add({t0:12.9,t1:14.15,x:950,y:520,html:`<div style="transform:scale(1.7)">${candle('f2')}</div>`,anim:popA(0.35),flame:'f2'});

// 3  prices
add({t0:14.24,t1:16.2,x:540,y:330,html:`<div class="chip r" style="font-size:110px;padding:20px 60px 28px">מחכים לכם!</div>`,anim:swing()});
add({t0:15.34,t1:16.2,x:560,y:520,html:`<div class="small" style="font-size:66px">בסופר חורי</div>`,anim:popA(0.3),r0:8,exit:0.15});
function priceTag(fill,top,big,sub,ids){return `<div class="tag">${tagSvg(fill)}
 <div class="tagtxt" id="${ids}a" style="top:150px;font-weight:800;font-size:58px">${top}</div>
 <div class="tagtxt" id="${ids}b" style="top:215px;font-family:'Secular One';font-size:140px;line-height:1" dir="ltr">${big}</div>
 <div class="tagtxt" id="${ids}c" style="top:390px;font-weight:800;font-size:44px">${sub}</div></div>`}
add({t0:16.26,t1:18.85,x:730,y:330,html:priceTag('#FFC23D','3 יחידות','₪<span class="n">20</span>','המיוחדות שלנו','p1'),anim:swing(),
  reveal:[['p1a',16.4],['p1b',16.88],['p1c',17.66]],count:['p1b',16.88,20]});
add({t0:19.0,t1:21.76,x:350,y:330,html:priceTag('#FFF6E6','4 יחידות','₪<span class="n">10</span>','ריבה / בלי ריבה','p2'),anim:swing(),
  reveal:[['p2c',19.0],['p2a',20.5],['p2b',20.8]],count:['p2b',20.8,10]});
add({t0:21.82,t1:23.6,x:540,y:300,html:`<div class="ribbon" style="font-size:112px">העוגות שלנו</div>`,anim:slide(-1),wob:1});
add({t0:22.46,t1:23.6,x:540,y:520,html:`<div class="chip g" style="font-size:80px">לכבוד שבת קודש</div>`,anim:popA(0.34),r0:-8,exit:0.18});
add({t0:22.9,t1:23.6,x:900,y:160,html:cake,anim:popA(0.3),r0:25,wob:4,exit:0.15});
add({t0:23.66,t1:24.95,x:540,y:380,html:`<div class="badge" style="transform:scale(.85)">${badgeSvg()}<div class="tagtxt" style="top:150px;font-family:'Secular One';font-size:130px;line-height:1">3 עוגות</div><div class="tagtxt" style="top:290px;font-family:'Secular One';font-size:130px;color:#E5336B;line-height:1">ב-<bdi dir="ltr">₪100</bdi></div></div>`,anim:slam(),r0:6,wob:2});
// opening hours
add({t0:24.98,t1:27.9,x:540,y:190,html:`<div class="chip r" style="font-size:88px">מחכים לכם פה</div>`,anim:popA(0.36),r0:-6,wob:1});
add({t0:25.9,t1:27.9,x:250,y:430,html:clockSvg,anim:popA(0.36),r0:-30,wob:3,clock:25.9});
add({t0:26.0,t1:27.9,x:720,y:360,html:`<div class="small" style="font-size:62px;background:#FFF6E6">פתוחים עד</div>`,anim:popA(0.3),r0:8});
add({t0:26.98,t1:27.9,x:720,y:490,html:`<div class="giant" style="font-size:150px;-webkit-text-stroke:10px #3A1C10;color:#FFC23D">17:00</div>`,anim:slam(),r0:-4,exit:0.18});

// 4  outro — giant behind him, logo in front
add({layer:'B',t0:27.94,t1:30.2,x:540,y:330,html:`<div class="giant" style="font-size:230px;color:#E5336B;-webkit-text-stroke-color:#3A1C10">אוהבים</div>`,anim:popA(0.42),r0:6,wob:1,exit:0.01});
add({t0:28.3,t1:30.2,x:850,y:560,html:`<div class="chip r" style="font-size:96px">אתכם</div>`,anim:popA(0.42),r0:-6,wob:-1,exit:0.01});
add({t0:28.94,t1:30.2,x:540,y:1180,html:`<div class="chip g" style="font-size:84px;padding:16px 56px 24px">סופר חורי · ${pin}שדרות</div>`,anim:popA(0.4),r0:-5,wob:0.8,exit:0.01});
[[170,250,28.0,'#E5336B',120],[910,700,28.2,'#FFC23D',100],[140,820,28.45,'#7FD8BE',80],[930,240,28.6,'#E5336B',90]].forEach(([x,y,t,c,s],i)=>
  add({t0:t,t1:30.2,x,y,html:heart(c,s),exit:0.01,anim:(lt)=>({s:outBack(lt/0.35),dy:-30*lt+10*Math.sin(lt*3+i),r:10*Math.sin(lt*4+i)})}));

// ---------- build ----------
const stage=document.getElementById('stage');
E.forEach(e=>{const d=document.createElement('div');d.className='el';d.innerHTML=e.html;stage.appendChild(d);e.node=d;e.w=d.offsetWidth;e.h=d.offsetHeight;
  e.wob=e.wob||0;e.r0=e.r0||0;e.revealEls=(e.reveal||[]).map(([id,t])=>[d.querySelector('#'+id),t])});
window.render=(t,layer)=>{let any=false;
 for(const e of E){const on=e.layer===layer&&t>=e.t0&&t<e.t1;e.node.style.display=on?'block':'none';if(!on)continue;any=true;
  const lt=t-e.t0,a=e.anim(lt,e);const s=a.s??1,r=a.r??0,dx=a.dx??0,dy=a.dy??0,o=a.o??1;
  e.node.style.transformOrigin=a.origin||'50% 50%';
  e.node.style.transform=`translate(${e.x-e.w/2+dx}px,${e.y-e.h/2+dy}px) rotate(${r}deg) scale(${Math.max(0,s)})`;e.node.style.opacity=clamp(o);
  for(const [n,tt] of e.revealEls){const k=clamp((t-tt)/0.28);n.style.opacity=k?1:0;n.style.transform=`scale(${outBack(k)})`}
  if(e.count){const [id,tt,v]=e.count;const n=e.node.querySelector('#'+id+' .n');n.textContent=Math.round(v*outCubic((t-tt)/0.45))}
  if(e.flame){const f=e.node.querySelector('#'+e.flame);f.setAttribute('transform',`translate(40 62) scale(${1+0.08*Math.sin(t*23)},${1+0.12*Math.sin(t*17+1)}) translate(-40 -62)`)}
  if(e.clock){const k=outCubic((t-e.clock)/1.1);e.node.querySelector('#mh').setAttribute('transform',`rotate(${k*720} 150 150)`);e.node.querySelector('#hh').setAttribute('transform',`rotate(${k*150} 150 150)`)}
 }
 return any};
</script></body></html>
