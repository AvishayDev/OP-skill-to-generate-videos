<script>
'use strict';
// ============================================================
// 09 · CROSS-STITCH EMBROIDERY on Aida cloth, in a wooden hoop.
// Every frame: the scene is drawn with flat shapes into a low-res buffer (60x107 cells, 18 px),
// voted down to a DMC-like thread palette, then every cell is sewn as a real X stitch
// (two 2-ply strands, twisted fibre shading, top leg last, shadow on the cloth).
// Backstitch outlines trace the cell edges (diagonals smooth the staircases); faces, limbs and
// the star's string are free backstitch snapped to the cloth holes. Text = petite stitches
// on the half grid. Motion on threes (8 fps): each pose is re-stitched.
// Opening: a printed ("stamped") pattern is already on the cloth and the scene sews itself in.
// ============================================================
const CELL = 18, COLS = 60, ROWS = 107, SS = 3, SUBW = CELL / SS, RW = COLS * SS, RH = ROWS * SS;
const FCELL = 9, FCOLS = 120, FROWS = 214;
const CS = 1.2;                                   // character is sewn a bit bigger than the story body (more cells = more face)
const HOOP = { cx: 540, cy: 960, rx: 622, ry: 1082, band: 50 };
const inHoop = (x, y, pad = 0) => ((x - HOOP.cx) / (HOOP.rx + pad)) ** 2 + ((y - HOOP.cy) / (HOOP.ry + pad)) ** 2 < 1;
const QF = 8;
const TITLE_W = 850;                                     // content frame rate (on threes)

// ---------- thread palette (DMC-like) ----------
// [name, hex, outline class, group, metallic]
const THREADS = [
  ['coral', '#ee7a5c', 1, 'char'], ['coralD', '#c8503e', 1, 'char'], ['coralL', '#ffab8a', 1, 'char'],
  ['blush', '#ff5c86', 1, 'char'], ['mouth', '#7a1c34', 1, 'char'], ['tan', '#e9b98f', 1, 'char'],
  ['eyeW', '#fbfbf6', 1, 'char'], ['ink', '#231a2d', 1, 'char'],
  ['gold', '#e9b23a', 3, 'star', 1], ['goldD', '#b67d12', 3, 'star', 1], ['goldL', '#ffe38c', 3, 'star', 1],
  ['sBlush', '#ff8a7a', 3, 'star'], ['sInk', '#3a2436', 3, 'star'],
  ['lilac', '#ab92dc', 4, 'block'], ['lilacD', '#7f62bf', 4, 'block'], ['lilacL', '#cdbdf2', 4, 'block'],
  ['teal', '#4dbda4', 5, 'block'], ['tealD', '#2a8f78', 5, 'block'], ['tealL', '#95e0cd', 5, 'block'],
  ['bangY', '#ffd23a', 6, 'bang'], ['bangR', '#df334b', 6, 'bang'],
  ['g1', '#acd96b', 0, 'ground'], ['g2', '#79bd4b', 0, 'ground'], ['g3', '#4f983a', 0, 'ground'], ['g4', '#387633', 0, 'ground'],
  ['fPink', '#ff8db0', 0, 'ground'], ['fYel', '#ffd641', 0, 'ground'], ['fWhite', '#fffdf5', 0, 'ground'],
  ['cW', '#fffefa', 0, 'cloud'], ['cB', '#b9d6ee', 0, 'cloud'],
  ['tInk', '#2a2142', 0, 'text'], ['tBlue', '#1d4fb3', 0, 'text'], ['tRed', '#e2463c', 0, 'text'],
];
const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const shade = (c, k) => { const f = v => Math.round(clamp(k > 1 ? v + (255 - v) * (k - 1) : v * k, 0, 255)); return `rgb(${f(c[0])},${f(c[1])},${f(c[2])})`; };
const TH = THREADS.map(([name, hex, cls, grp, metal]) => ({ name, hex, rgb: hexRgb(hex), cls, grp, metal: !!metal }));
const IX = Object.fromEntries(TH.map((t, i) => [t.name, i]));
const T = n => TH[IX[n]].hex;
const INK = '#2b2133';
const _thr = new Map();
function thr(hex, metal = false) {   // cached shades for free stitches
  const k = hex + metal; if (_thr.has(k)) return _thr.get(k);
  const c = hexRgb(hex), o = { dark: shade(c, metal ? .45 : .56), base: shade(c, 1), light: shade(c, metal ? 1.75 : 1.38), twist: shade(c, .42) };
  _thr.set(k, o); return o;
}
const hash3 = (a, b, c) => { let h = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) >>> 0; h = Math.imul(h ^ h >>> 13, 1274126177) >>> 0; return h; };

// ============================================================
// STITCH SPRITES (made once): X stitch = two strands, each 2 plies, twisted, shaded
// ============================================================
const NV = 5, SPR = [], HALF = [], PRINT = [];
function ply(g, len, off, pw, col, metal, r, sgn) {
  // a ply that narrows where it dives into the hole
  const N = 14, top = [], bot = [];
  for (let k = 0; k <= N; k++) { const u = k / N, x = u * len, s = Math.sqrt(Math.sin(Math.PI * clamp(u, .02, .98)));
    const oc = off * (.35 + .65 * s), hw = pw / 2 * (.5 + .5 * s); top.push([x, oc - hw]); bot.push([x, oc + hw]); }
  const p = new Path2D(); p.moveTo(top[0][0], top[0][1]); for (const q of top) p.lineTo(q[0], q[1]);
  p.arcTo(len + pw * .35, off * .35, bot[N][0], bot[N][1], pw * .3);
  for (let k = N; k >= 0; k--) p.lineTo(bot[k][0], bot[k][1]); p.arcTo(-pw * .35, off * .35, top[0][0], top[0][1], pw * .3); p.closePath();
  const gr = g.createLinearGradient(0, off - pw / 2 * sgn, 0, off + pw / 2 * sgn);
  gr.addColorStop(0, shade(col, metal ? 1.55 : 1.22)); gr.addColorStop(.28, shade(col, metal ? 1.25 : 1.06)); gr.addColorStop(.55, shade(col, 1));
  gr.addColorStop(1, shade(col, metal ? .5 : .66));
  g.fillStyle = gr; g.fill(p);
  g.save(); g.clip(p);
  // twist: slanted fibre grooves + light ridges
  const st = pw * .78, ph = r() * st;
  g.lineWidth = Math.max(.7, pw * .11); g.lineCap = 'round';
  for (let x = -pw + ph; x < len + pw; x += st) {
    g.strokeStyle = `rgba(${col.map(v => v * .4 | 0).join(',')},${metal ? .45 : .34})`;
    g.beginPath(); g.moveTo(x - pw * .45, off - pw * .6); g.lineTo(x + pw * .45, off + pw * .6); g.stroke();
    g.strokeStyle = metal ? 'rgba(255,255,235,.55)' : `rgba(255,255,255,${.16 + r() * .08})`;
    g.beginPath(); g.moveTo(x - pw * .45 + st * .4, off - pw * .6); g.lineTo(x + pw * .1 + st * .4, off - pw * .05); g.stroke();
  }
  if (metal) { g.fillStyle = 'rgba(255,255,245,.85)'; for (let k = 0; k < 3; k++) { const x = len * (.2 + r() * .6); g.beginPath(); g.ellipse(x, off - pw * .18 * sgn, pw * .5, pw * .12, 0, 0, TAU); g.fill(); } }
  // fuzz
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = .5;
  for (let k = 0; k < 3; k++) { const x = r() * len; g.beginPath(); g.moveTo(x, off - pw * .4); g.lineTo(x + (r() - .5) * pw, off - pw * .75); g.stroke(); }
  g.restore();
}
function strand(g, p0, p1, col, w, r, metal) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  const sgn = Math.cos(a) >= 0 ? 1 : -1;      // keep the lit side facing up
  g.save(); g.translate(p0[0], p0[1]); g.rotate(a);
  const pw = w * .58;
  for (const off of [-w * .21, w * .21]) ply(g, len, off, pw, col, metal, r, sgn);
  g.restore();
}
function mkStitch(t, size, v, half) {
  const m = Math.ceil(size * .5), cv2 = mkCanvas(Math.round((size + 2 * m) * S), Math.round((size + 2 * m) * S)), g = cv2.getContext('2d');
  g.scale(S, S); g.translate(m, m);
  const r = rng(hash3(t.rgb[0] * 7 + t.rgb[1], t.rgb[2] + 11, v * 31 + size + (half ? 5000 : 0)));
  const tone = 1 + (r() - .5) * .07, col = t.rgb.map(c => clamp(c * tone, 0, 255));
  const ins = size * .1, j = () => (r() - .5) * size * .09;
  const A = [[ins + j(), size - ins + j()], [size - ins + j(), ins + j()]];   // bottom leg  /
  const B = [[ins + j(), ins + j()], [size - ins + j(), size - ins + j()]];   // top leg    \
  const w = size * .47 * (1 + (r() - .5) * .08);
  g.save(); g.filter = `blur(${size * .075 * S}px)`; g.strokeStyle = 'rgba(58,36,14,.46)'; g.lineCap = 'round'; g.lineWidth = w * 1.05;
  for (const L of half ? [A] : [A, B]) { g.beginPath(); g.moveTo(L[0][0] + size * .07, L[0][1] + size * .11); g.lineTo(L[1][0] + size * .07, L[1][1] + size * .11); g.stroke(); }
  g.restore();
  strand(g, A[0], A[1], col, w, r, t.metal);
  if (!half) {
    g.save(); g.filter = `blur(${size * .06 * S}px)`; g.strokeStyle = 'rgba(40,20,8,.38)'; g.lineWidth = w * .95; g.lineCap = 'round';
    g.beginPath(); g.moveTo(B[0][0] + size * .05, B[0][1] + size * .08); g.lineTo(B[1][0] + size * .05, B[1][1] + size * .08); g.stroke(); g.restore();
    strand(g, B[0], B[1], col, w, r, t.metal);
  }
  return { c: cv2, m, size };
}
function mkPrint(t) {   // stamped-pattern print on the cloth: faded colour square + thin X
  const cv2 = mkCanvas(Math.round(CELL * S), Math.round(CELL * S)), g = cv2.getContext('2d'); g.scale(S, S);
  g.fillStyle = `rgba(${t.rgb.join(',')},.38)`; g.fillRect(2.5, 2.5, CELL - 5, CELL - 5);
  g.strokeStyle = `rgba(${t.rgb.map(v => v * .55 | 0).join(',')},.55)`; g.lineWidth = 1.3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(4, 4); g.lineTo(CELL - 4, CELL - 4); g.moveTo(CELL - 4, 4); g.lineTo(4, CELL - 4); g.stroke();
  return cv2;
}
function buildSprites() {
  TH.forEach((t, i) => {
    SPR[i] = [0, 1].map(s => Array.from({ length: NV }, (_, v) => mkStitch(t, s ? FCELL : CELL, v, false)));
    HALF[i] = [0, 1].map(s => mkStitch(t, s ? FCELL : CELL, 0, true));
    PRINT[i] = mkPrint(t);
  });
}
const putSpr = (c, sp, x, y) => c.drawImage(sp.c, x - sp.m, y - sp.m, sp.size + 2 * sp.m, sp.size + 2 * sp.m);

// ============================================================
// FREE STITCHES: backstitch, straight stitches, star stitches, french knots, loose thread
// ============================================================
function threadSeg(c, x0, y0, x1, y1, hex, w = 5, metal = false) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 2) return;
  const ux = (x1 - x0) / len, uy = (y1 - y0) / len, g0 = Math.min(1.8, len * .12);
  x0 += ux * g0; y0 += uy * g0; x1 -= ux * g0; y1 -= uy * g0;
  const th = thr(hex, metal), nx = -uy, ny = ux, up = ny > 0 ? -1 : 1;
  c.lineCap = 'round';
  c.strokeStyle = 'rgba(52,32,12,.36)'; c.lineWidth = w * 1.15; c.beginPath(); c.moveTo(x0 + 1.4, y0 + 2.2); c.lineTo(x1 + 1.4, y1 + 2.2); c.stroke();
  c.strokeStyle = th.dark; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  c.strokeStyle = th.base; c.lineWidth = w * .66; c.beginPath(); c.moveTo(x0 - nx * up * w * .06, y0 - ny * up * w * .06); c.lineTo(x1 - nx * up * w * .06, y1 - ny * up * w * .06); c.stroke();
  const ho = w * .17 * up; c.strokeStyle = th.light; c.lineWidth = w * .24; c.globalAlpha = metal ? .95 : .75;
  c.beginPath(); c.moveTo(x0 + nx * ho + ux * w * .3, y0 + ny * ho + uy * w * .3); c.lineTo(x1 + nx * ho - ux * w * .3, y1 + ny * ho - uy * w * .3); c.stroke(); c.globalAlpha = 1;
  // twist grooves
  c.strokeStyle = th.twist; c.globalAlpha = .45; c.lineWidth = Math.max(.8, w * .14); c.beginPath();
  for (let d = w * .6; d < len - w * .4; d += w * .85) { const px = x0 + ux * d, py = y0 + uy * d; c.moveTo(px + nx * w * .42 - ux * w * .25, py + ny * w * .42 - uy * w * .25); c.lineTo(px - nx * w * .42 + ux * w * .25, py - ny * w * .42 + uy * w * .25); }
  c.stroke(); c.globalAlpha = 1;
}
// resample a polyline and snap to the cloth holes (grid g). Each hop = one backstitch.
function snapPts(pts, g = FCELL, step = 18) {
  const out = []; const push = (x, y) => { const q = [Math.round(x / g) * g, Math.round(y / g) * g]; const l = out[out.length - 1]; if (!l || l[0] !== q[0] || l[1] !== q[1]) out.push(q); };
  push(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length; k++) {
    const [ax, ay] = pts[k - 1], [bx, by] = pts[k], L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(L / step));
    for (let s = 1; s <= n; s++) push(lerp(ax, bx, s / n), lerp(ay, by, s / n));
  }
  return out;
}
function backstitch(c, pts, hex, w = 5, g = FCELL, step = 18, metal = false) {
  const p = snapPts(pts, g, step); for (let k = 1; k < p.length; k++) threadSeg(c, p[k - 1][0], p[k - 1][1], p[k][0], p[k][1], hex, w, metal);
}
function starStitch(c, x, y, r, hex, rot = 0, metal = true) {
  x = Math.round(x / FCELL) * FCELL; y = Math.round(y / FCELL) * FCELL;
  for (let k = 0; k < 4; k++) { const a = rot + k * Math.PI / 4, dx = Math.cos(a) * r, dy = Math.sin(a) * r; threadSeg(c, x - dx, y - dy, x + dx, y + dy, hex, 4.6, metal); }
}
function knot(c, x, y, hex, r = 6.5, metal = false) {
  const th = thr(hex, metal);
  c.fillStyle = 'rgba(50,30,10,.4)'; c.beginPath(); c.arc(x + 1.6, y + 2.4, r * 1.05, 0, TAU); c.fill();
  const g = c.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, th.light); g.addColorStop(.45, th.base); g.addColorStop(1, th.dark);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.strokeStyle = th.twist; c.globalAlpha = .5; c.lineWidth = Math.max(.8, r * .18);
  for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(x, y, r * (.45 + k * .17), k * 2.1, k * 2.1 + 2.2); c.stroke(); }
  c.globalAlpha = 1; c.fillStyle = metal ? '#fffbe6' : 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(x - r * .35, y - r * .4, r * .22, 0, TAU); c.fill();
}
// a loose thread lying on the cloth (smooth curve)
function looseThread(c, pts, hex, w = 5, metal = false) {
  const th = thr(hex, metal), p = new Path2D();
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  const L = pts[pts.length - 1]; p.lineTo(L[0], L[1]);
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  c.save(); c.translate(2, 3.5); c.filter = `blur(${2 * S}px)`; c.strokeStyle = 'rgba(40,24,8,.4)'; c.lineWidth = w * 1.2; c.stroke(p); c.restore();
  c.strokeStyle = th.dark; c.lineWidth = w; c.stroke(p);
  c.strokeStyle = th.base; c.lineWidth = w * .66; c.stroke(p);
  c.save(); c.translate(-w * .12, -w * .14); c.strokeStyle = th.light; c.globalAlpha = .7; c.lineWidth = w * .22; c.stroke(p); c.restore();
  c.strokeStyle = th.twist; c.globalAlpha = .5; c.lineWidth = w * .9; c.setLineDash([1.1, w * .75]); c.stroke(p);
  c.restore();
}
function needle(c, tx, ty, ang, hex, tail) {
  c.save(); c.translate(tx, ty); c.rotate(ang);
  const body = new Path2D(); body.moveTo(0, 0); body.lineTo(34, -3.2); body.lineTo(150, -4.2); body.arc(152, 0, 4.2, -Math.PI / 2, Math.PI / 2); body.lineTo(34, 3.2); body.closePath();
  c.save(); c.translate(3, 7); c.filter = `blur(${3 * S}px)`; c.fillStyle = 'rgba(30,20,10,.45)'; c.fill(body); c.restore();
  const g = c.createLinearGradient(0, -4.5, 0, 4.5); g.addColorStop(0, '#6d737c'); g.addColorStop(.3, '#f7f9fb'); g.addColorStop(.55, '#aeb4bc'); g.addColorStop(1, '#4f535a');
  c.fillStyle = g; c.fill(body);
  c.fillStyle = '#2a2622'; c.beginPath(); c.ellipse(140, 0, 7, 1.5, 0, 0, TAU); c.fill();
  c.restore();
  if (tail) {   // thread from the eye back to the last stitch
    const ex = tx + Math.cos(ang) * 140, ey = ty + Math.sin(ang) * 140;
    looseThread(c, [[ex, ey], [ex + 30, ey + 40], [lerp(ex, tail[0], .6) + 20, lerp(ey, tail[1], .6) + 30], [tail[0], tail[1]]], hex, 5);
  }

// ============================================================
// RASTER: flat shapes -> thread cells (3x3 votes per cell, blends ignored)
// ============================================================
let RC, R, FC, F;
const QCACHE = new Map();
function raster(cands, fn, over) {
  R.setTransform(1, 0, 0, 1, 0, 0); R.clearRect(0, 0, RW, RH); R.setTransform(1 / SUBW, 0, 0, 1 / SUBW, 0, 0);
  fn(R);
  const d = R.getImageData(0, 0, RW, RH).data, g = new Int16Array(COLS * ROWS).fill(-1);
  const key = cands.join(','); if (!QCACHE.has(key)) QCACHE.set(key, new Map()); const qc = QCACHE.get(key);
  const q = (r, gg, b) => { const k = r << 16 | gg << 8 | b; let v = qc.get(k); if (v !== undefined) return v; let best = -2, bd = 46 * 46;
    for (const ci of cands) { const c = TH[ci].rgb, dd = (c[0] - r) ** 2 + (c[1] - gg) ** 2 + (c[2] - b) ** 2; if (dd < bd) { bd = dd; best = ci; } } qc.set(k, best); return best; };
  const vi = new Int16Array(9), vn = new Int8Array(9);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    let empty = 0, nv = 0;
    for (let b = 0; b < SS; b++) for (let a = 0; a < SS; a++) {
      const o = ((j * SS + b) * RW + i * SS + a) * 4, al = d[o + 3];
      if (al < 60) { empty++; continue; } if (al < 200) continue;
      const e = q(d[o], d[o + 1], d[o + 2]); if (e < 0) continue;
      let f = -1; for (let k = 0; k < nv; k++) if (vi[k] === e) { f = k; break; }
      if (f < 0) { vi[nv] = e; vn[nv++] = 1; } else vn[f]++;
    }
    let bi = -1, bc = 0; for (let k = 0; k < nv; k++) if (vn[k] > bc) { bc = vn[k]; bi = vi[k]; }
    if (bc > empty) g[j * COLS + i] = bi;
  }
  if (over) for (const [x, y, e, only] of over) { const i = Math.floor(x / CELL), j = Math.floor(y / CELL); if (i < 0 || j < 0 || i >= COLS || j >= ROWS) continue; const k = j * COLS + i; if (only === undefined || g[k] === only) g[k] = e; }
  return g;
}
const TXT = [IX.tInk, IX.tBlue, IX.tRed];
function fineRaster(fn) {
  F.setTransform(1, 0, 0, 1, 0, 0); F.clearRect(0, 0, FCOLS, FROWS); F.setTransform(1 / FCELL, 0, 0, 1 / FCELL, 0, 0);
  fn(F);
  const d = F.getImageData(0, 0, FCOLS, FROWS).data, g = new Int16Array(FCOLS * FROWS).fill(-1);
  for (let k = 0; k < FCOLS * FROWS; k++) { const o = k * 4; if (d[o + 3] < 118) continue;
    let best = -1, bd = 1e9; for (const ci of TXT) { const c = TH[ci].rgb, dd = (c[0] - d[o]) ** 2 + (c[1] - d[o + 1]) ** 2 + (c[2] - d[o + 2]) ** 2; if (dd < bd) { bd = dd; best = ci; } } g[k] = best; }
  return g;
}
const CAND_A = TH.map((t, i) => i).filter(i => TH[i].grp === 'star' || TH[i].grp === 'block');
const CAND_B = TH.map((t, i) => i).filter(i => TH[i].grp === 'char' || TH[i].grp === 'bang');
const CAND_G = TH.map((t, i) => i).filter(i => TH[i].grp === 'ground');
const CAND_C = TH.map((t, i) => i).filter(i => TH[i].grp === 'cloud');

// ============================================================
// SCENE SHAPES (drawn into the raster, world units)
// ============================================================
const fillE = (c, x, y, rx, ry, col, rot = 0) => { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill(); };
function starPath(R0, r0) { const p = new Path2D(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr = i % 2 ? r0 : R0; i ? p.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : p.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } p.closePath(); return p; }
const STARP = starPath(STAR_R, STAR_R * .5);
const SSC = 1.18;
const HANG_X = 58;   // hang a little lower than the story so the sewn face stays clear of the (bigger) star   // star is sewn a little bigger too
function starNow(t) {

// ============================================================
// EFFECTS (free stitches)
// ============================================================

film({
  setup() {
    RC = mkCanvas(RW, RH); R = RC.getContext('2d', { willReadFrequently: true });
    FC = mkCanvas(FCOLS, FROWS); F = FC.getContext('2d', { willReadFrequently: true });
    CV = mkCanvas(OUT_W, OUT_H); CX = CV.getContext('2d');
    buildSprites(); buildFabric(); buildHoop(); buildGround(); buildTitle();
  },

        getup: t => { mb(t, 79, .045, .8, sfx); mb(t + .08, 84, .045, .9, sfx); pull(t, .2, .05, 900, 2600); },
        drop: t => pull(t, .24, .07, 3200, 700),
