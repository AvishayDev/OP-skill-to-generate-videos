<script>
'use strict';
// ============================================================
// 05 · CHALK ON A BLACKBOARD.
// Everything moving is drawn each frame into one "chalk" layer (broken jittered strokes with
// noise-driven skips + side-of-chalk scumble fills), then the whole layer is multiplied by a
// board-grain alpha mask (destination-in) so chalk skips on the slate tooth, then composited
// with a soft downscaled "powder" halo. Dark details (pupils, mouths, star face) are ERASED
// out of the chalk so the slate shows through. Fast motion leaves soft smudge ghosts.
// Boil on twos. Voice: classroom nylon guitar, claps, shaker, chalk squeaks, book slam, bell.
// ============================================================
const C = {
  board: '#1f2d27', white: '#f3f0e4', yellow: '#f7df6e', pink: '#ffa8c3', pinkD: '#ff7ba4',
  blue: '#a9d3f3', green: '#b2e39b', orange: '#ffc58c', lilac: '#d2bdf5',
};
let BF = 0;
const SMK = 4;                                 // smudge layer = 1/SMK resolution

// ---------- geometry helpers ----------
function ell(cx, cy, rx, ry, n = 36, wob = 0, seed = 1) {
  const r = rng(seed), ph = [r() * TAU, r() * TAU], pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU, m = 1 + wob * (Math.sin(a * 2 + ph[0]) * .6 + Math.sin(a * 3 + ph[1]) * .4); pts.push([cx + Math.cos(a) * rx * m, cy + Math.sin(a) * ry * m]); }
  return pts;
}
function starPts(R, r) { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr = i % 2 ? r : R; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }
function pathOf(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, y] of pts) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return [a, b, c, d]; }
function jit(pts, seed, amp) { const r = rng(seed * 7919 + BF * 131); return pts.map(p => [p[0] + (r() - .5) * 2 * amp, p[1] + (r() - .5) * 2 * amp]); }
// Catmull-Rom resample -> dense smooth polyline
function spline(pts, closed, seg = 6) {
  const n = pts.length, out = [], P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2), m = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / seg));
    for (let j = 0; j < m; j++) { const u = j / m, u2 = u * u, u3 = u2 * u, f = k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * u + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u3); out.push([f(0), f(1)]); }
  }
  out.push(closed ? out[0] : pts[n - 1]); return out;
}

// ---------- the chalk primitives ----------
// Broken dusty line: jittered spline, value-noise skips along the arc, a thinner offset second pass, dust specks.
function chalkLine(g, pts, w, col, seed, o = {}) {
  const { closed = false, amp = 1.6, k = 1, gap = .17, a = .92, dual = true, specks = true, seg = 5 } = o;
  if (k <= 0 || a <= 0) return;
  const q = spline(jit(pts, seed, amp), closed, seg), r = rng(seed * 977 + BF * 31);
  const cum = [0]; for (let i = 1; i < q.length; i++) cum.push(cum[i - 1] + Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]));
  const tot = cum[cum.length - 1], lim = tot * k, cell = 30 + w * 2;
  const gl = []; const gr = rng(seed * 13 + BF * 7); for (let i = 0; i < tot / cell + 3; i++) gl.push(gr());
  const gapAt = s => { const u = s / cell, i = Math.floor(u), f = u - i, sm = f * f * (3 - 2 * f); return lerp(gl[i], gl[i + 1], sm); };
  g.save(); g.strokeStyle = col; g.fillStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let pass = 0; pass < (dual ? 2 : 1); pass++) {
    g.lineWidth = pass ? w * .45 : w; g.globalAlpha = pass ? a * .6 : a;
    const ox = pass ? (r() - .5) * w * .7 : 0, oy = pass ? (r() - .5) * w * .7 : 0, th = gap + (pass ? .12 : 0);
    g.beginPath(); let pen = false;
    for (let i = 1; i < q.length; i++) {
      if (cum[i - 1] >= lim) break;
      if (gapAt(cum[i]) < th) { pen = false; continue; }
      let [x0, y0] = q[i - 1], [x1, y1] = q[i];
      if (cum[i] > lim) { const f = (lim - cum[i - 1]) / (cum[i] - cum[i - 1] || 1); x1 = lerp(x0, x1, f); y1 = lerp(y0, y1, f); }
      if (!pen) { g.moveTo(x0 + ox, y0 + oy); pen = true; }
      g.lineTo(x1 + ox, y1 + oy);
    }
    g.stroke();
  }
  if (specks) {
    let nIn = 0; while (nIn < q.length - 1 && cum[nIn] < lim) nIn++;
    const n = Math.floor(Math.min(lim, tot) / 30); g.globalAlpha = a * .55;
    for (let i = 0; i < n; i++) { const p = q[Math.floor(r() * nIn)], s = 1 + r() * w * .22; g.fillRect(p[0] + (r() - .5) * w * 3.2, p[1] + (r() - .5) * w * 3.2, s, s); }
  }
  g.restore();
}
// Side-of-chalk scumble: broken parallel strokes clipped to a shape.
function chalkFill(g, pts, col, seed, o = {}) {
  const { sp = 10, w = 8, a = .4, ang = -.55, cross = 0 } = o;
  if (a <= 0) return;
  const r = rng(seed * 131 + BF * 17), [x0, y0, x1, y1] = bbox(pts), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 8;
  g.save(); g.clip(pathOf(pts)); g.strokeStyle = col; g.lineCap = 'round'; g.translate(cx, cy);
  const hatch = (an, al) => {
    g.save(); g.rotate(an);
    for (let y = -R + r() * sp; y < R; y += sp * (.8 + r() * .4)) {
      g.lineWidth = w * (.7 + r() * .6); g.globalAlpha = al * (.55 + r() * .7); g.beginPath();
      let x = -R - r() * 40; while (x < R) { const len = 30 + r() * 110; g.moveTo(x, y + (r() - .5) * 3); g.lineTo(x + len, y + (r() - .5) * 5); x += len + (r() < .35 ? 6 + r() * 26 : 1); }
      g.stroke();
    }
    g.restore();
  };
  hatch(ang, a); if (cross) hatch(ang + 1.15, a * cross);
  g.restore();
}
// Erase (slate shows through): used for pupils, mouths, occlusion.
function erase(g, f, al = 1) { g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = al; g.fillStyle = '#000'; g.strokeStyle = '#000'; f(g); g.restore(); }
function eraseLine(g, pts, w) { erase(g, q => { q.lineWidth = w; q.lineCap = 'round'; q.lineJoin = 'round'; const s = spline(pts, false, 4); q.beginPath(); q.moveTo(s[0][0], s[0][1]); for (const p of s) q.lineTo(p[0], p[1]); q.stroke(); }); }
// Chalk handwriting: solid text + thin stroke; the grain mask erodes it later. k = write-on (right to left).
// After the grain pass a faint un-grained copy is laid on top (POST queue) so words stay legible.
let POST = [];
function chalkText(g, str, x, y, size, col, font, k = 1, a = .95, wt = '', halo = 0) {
  if (k <= 0) return 0;
  const body = (q, al, lw) => {
    q.save(); q.font = `${wt} ${size}px ${font}`.trim(); q.direction = 'rtl'; q.textAlign = 'center'; q.textBaseline = 'middle';
    const w = q.measureText(str).width;
    if (k < 1) { q.beginPath(); q.rect(x + w / 2 + 20 - (w + 40) * k, y - size, (w + 40) * k + 10, size * 2); q.clip(); }
    q.lineJoin = 'round'; q.lineCap = 'round';
    if (halo && lw) erase(q, e => { e.lineWidth = halo; e.lineJoin = 'round'; e.strokeText(str, x, y); e.fillText(str, x, y); });
    q.globalAlpha = al; q.fillStyle = col; q.strokeStyle = col;
    q.fillText(str, x + (BF % 2 ? .8 : -.8), y); if (lw) { q.lineWidth = lw; q.strokeText(str, x, y); }
    q.restore(); return w;
  };
  const w = body(g, a, size * .045);
  POST.push({ m: g.getTransform(), f: q => body(q, .42, 0) });
  return w;
}

// ---------- grain (the slate tooth) ----------
let GRAIN, GRAIN_P;
function makeGrain(N = 512) {
  const c = mkCanvas(N, N), g = c.getContext('2d'), im = g.createImageData(N, N), d = im.data;
  const lat = (Px, Py, seed) => { const r = rng(seed), a = new Float32Array(Px * Py); for (let i = 0; i < a.length; i++) a[i] = r();
    return (x, y) => { const u = x / N * Px, v = y / N * Py, i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j, su = fu * fu * (3 - 2 * fu), sv = fv * fv * (3 - 2 * fv);
      const I = i % Px, I1 = (i + 1) % Px, J = j % Py, J1 = (j + 1) % Py;
      return lerp(lerp(a[J * Px + I], a[J * Px + I1], su), lerp(a[J1 * Px + I], a[J1 * Px + I1], su), sv); }; };
  const n1 = lat(16, 16, 1), n2 = lat(64, 64, 2), st = lat(6, 170, 3), r = rng(5);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const v = .38 * n1(x, y) + .27 * n2(x, y) + .35 * st(x, y), f = r(), f2 = r(), s = v * .75 + f * .45 + (f2 < .08 ? -.3 : 0);
    const a = clamp((s - .47) / .26); d[(y * N + x) * 4 + 3] = 255 * a * a * (3 - 2 * a); d[(y * N + x) * 4] = d[(y * N + x) * 4 + 1] = d[(y * N + x) * 4 + 2] = 255;
  }
  g.putImageData(im, 0, 0); return c;
}
function applyGrain(g, ox, oy) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); GRAIN_P.setTransform(new DOMMatrix().translateSelf(ox, oy));
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = GRAIN_P; g.fillRect(0, 0, OUT_W, OUT_H); g.restore();
}

// ---------- static board + frame ----------
const FONT = 'OHRonShemer';
let L_BOARD, L_FRAME;
function streakBand(g, cx, cy, rad, a0, a1, bw, alpha, col, seed) {   // an eraser swipe: arc of thin parallel streaks
  const r = rng(seed); g.save(); g.strokeStyle = col; g.lineCap = 'round';
  for (let i = 0; i < bw / 3; i++) { const rr = rad - bw / 2 + i * 3 + (r() - .5) * 2; g.lineWidth = 1 + r() * 3.5; g.globalAlpha = alpha * (.3 + r() * .9);
    const s0 = a0 + (r() - .5) * .08, s1 = a1 + (r() - .5) * .08; g.beginPath(); g.arc(cx, cy, rr, s0, s1); g.stroke(); }
  g.restore();
}
function buildBoard() {
  L_BOARD = layer(g => {
    g.fillStyle = C.board; g.fillRect(0, 0, W, H);
    const r = rng(1001);
    // mottled slate: big soft residue clouds + darker damp patches
    for (let i = 0; i < 46; i++) { const x = r() * W, y = r() * H, R = 120 + r() * 380, light = r() < .6;
      const gr = g.createRadialGradient(x, y, 0, x, y, R); gr.addColorStop(0, light ? `rgba(190,215,200,${.025 + r() * .045})` : `rgba(8,18,14,${.12 + r() * .15})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - R, y - R, 2 * R, 2 * R); }
    // eraser swipes (residue arcs)
    [[300, 1400, 900, -2.2, -1.2, 150, .05], [900, -200, 900, 1.75, 2.4, 170, .03], [-100, 700, 700, -.6, .5, 140, .05], [1300, 1300, 800, 2.6, 3.5, 160, .04], [540, 2400, 1200, -2.0, -1.2, 130, .035]]
      .forEach(([cx, cy, rad, a0, a1, bw, al], i) => streakBand(g, cx, cy, rad, a0, a1, bw, al, '#dfe9e2', 1100 + i));
    // ghosts of a previous lesson: drawn in chalk, then half erased, then laid down faint
    const ghost = layer(q => {
      q.lineCap = 'round'; q.lineJoin = 'round';
      q.font = '500 58px Heebo'; q.fillStyle = C.white; q.direction = 'ltr'; q.textAlign = 'left';
      q.fillText('x² + 3x = 10', 50, 760); q.fillText('a² + b² = c²', 700, 560); q.fillText('7 × 8 = 56', 60, 1240);
      q.font = '44px Heebo'; q.fillText('(x+5)(x−2)', 70, 830); q.fillText('π·r²', 850, 640);
      q.font = `64px ${FONT}`; q.direction = 'rtl'; q.textAlign = 'right'; q.fillText('שיעורי בית', 1020, 480); q.fillText('תרגיל 4', 330, 1120);
      q.strokeStyle = C.white; q.lineWidth = 5;
      q.beginPath(); q.moveTo(760, 880); q.lineTo(1010, 880); q.lineTo(760, 700); q.closePath(); q.stroke(); q.strokeRect(760, 852, 28, 28);   // right triangle
      q.beginPath(); q.moveTo(70, 1040); q.lineTo(300, 1040); q.moveTo(90, 1060); q.lineTo(90, 900); q.stroke();                       // axes
      q.beginPath(); for (let x = 0; x <= 200; x += 5) { const y = 1040 - 120 + ((x - 100) / 100) ** 2 * 110; x ? q.lineTo(100 + x, y) : q.moveTo(100 + x, y); } q.stroke();
      q.beginPath(); q.arc(960, 1000, 34, 0, TAU); q.stroke();
      // rub most of it out
      q.globalCompositeOperation = 'destination-out';
      [[200, 1500, 900, -1.9, -1.3, 170, .95], [1000, 200, 520, 1.9, 2.6, 150, .9], [-60, 820, 330, -.5, .6, 120, .85], [1250, 1150, 520, 2.6, 3.4, 160, .9], [300, 1450, 360, -1.9, -1.2, 110, .9]]
        .forEach(([cx, cy, rad, a0, a1, bw, al], i) => streakBand(q, cx, cy, rad, a0, a1, bw, al, '#000', 1200 + i));
      q.setTransform(1, 0, 0, 1, 0, 0); q.globalCompositeOperation = 'destination-in'; q.fillStyle = GRAIN_P; q.fillRect(0, 0, q.canvas.width, q.canvas.height);
    });
    g.globalAlpha = .13; g.drawImage(ghost, 0, 0, W, H); g.globalAlpha = 1;
    // fine slate speckle
    for (let i = 0; i < 5000; i++) { g.fillStyle = r() < .5 ? `rgba(220,235,225,${.02 + r() * .05})` : `rgba(0,0,0,${.06 + r() * .1})`; const s = .8 + r() * 1.8; g.fillRect(r() * W, r() * H, s, s); }
    // dust settled near the tray
    const dg = g.createLinearGradient(0, H - 260, 0, H - 60); dg.addColorStop(0, 'rgba(225,235,228,0)'); dg.addColorStop(1, 'rgba(225,235,228,.09)'); g.fillStyle = dg; g.fillRect(0, H - 260, W, 200);
  }, W + 40, H + 40);
  L_FRAME = layer(g => {
    const r = rng(1300), FW = 30, TY = H - 64;
    const wood = (x, y, w, h, vert) => {
      const gr = vert ? g.createLinearGradient(x, 0, x + w, 0) : g.createLinearGradient(0, y, 0, y + h);
      gr.addColorStop(0, '#8a5a32'); gr.addColorStop(.45, '#a8733f'); gr.addColorStop(1, '#5e3a1d'); g.fillStyle = gr; g.fillRect(x, y, w, h);
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.lineWidth = 1.2;
      for (let i = 0; i < (vert ? w : h) / 2.5; i++) { g.strokeStyle = `rgba(${r() < .5 ? '60,30,10' : '200,150,90'},${.08 + r() * .15})`; g.beginPath();
        const o = (vert ? x : y) + r() * (vert ? w : h), L = vert ? h : w, ph = r() * 9;
        for (let s = 0; s <= L; s += 40) { const d = Math.sin(s * .004 + ph) * 3 + Math.sin(s * .017 + ph) * 1.2; vert ? (s ? g.lineTo(o + d, y + s) : g.moveTo(o + d, y + s)) : (s ? g.lineTo(x + s, o + d) : g.moveTo(x + s, o + d)); }
        g.stroke(); }
      g.restore();
    };
    // inner shadow onto the slate
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(FW, FW, W - 2 * FW, 10); g.fillRect(FW, FW, 8, TY - FW); g.fillRect(W - FW - 6, FW, 6, TY - FW);
    wood(0, 0, FW, H, true); wood(W - FW, 0, FW, H, true); wood(0, 0, W, FW, false);
    // chalk tray
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(FW, TY - 12, W - 2 * FW, 12);
    wood(0, TY, W, H - TY, false);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, TY + 22, W, 4);
    for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(240,240,230,${.1 + r() * .3})`; const s = 1 + r() * 2.5; g.fillRect(40 + r() * (W - 80), TY + 4 + r() * 18, s, s * .6); }
    // chalk sticks + felt eraser
    [[150, 90, C.white, .02], [300, 70, C.yellow, -.05], [640, 60, C.pink, .04], [720, 46, C.blue, 0], [940, 64, C.white, -.03]].forEach(([x, l, col, rot]) => {
      g.save(); g.translate(x, TY + 8); g.rotate(rot); g.fillStyle = col; g.fillRect(-l / 2, -9, l, 17); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-l / 2, 3, l, 5);
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-l / 2, -8, l, 4); g.restore(); });
    g.save(); g.translate(470, TY - 6); g.rotate(-.02);
    g.fillStyle = '#6b4a2e'; g.fillRect(-90, -18, 180, 30); g.fillStyle = '#3c3f47'; g.fillRect(-90, 10, 180, 14);
    g.fillStyle = 'rgba(230,230,220,.55)'; for (let i = 0; i < 120; i++) g.fillRect(-88 + r() * 176, 12 + r() * 11, 2, 2);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(-90, -18, 180, 6); g.restore();
  });
}

// ---------- scene pieces (drawn into the chalk layer) ----------
function drawGround(g, t) {
  const k = eOut(prog(t, -.3, .3)), r = rng(2000);
  const line = []; for (let x = 1066; x >= 14; x -= 70) line.push([x, GY + 4 + Math.sin(x * .013) * 5 + (r() - .5) * 4]);   // drawn right to left
  chalkFill(g, [[14, GY + 2], [1066, GY + 2], [1066, GY + 70], [14, GY + 70]], C.green, 2010, { sp: 8, w: 6, a: .2 * k, ang: .06 });
  chalkLine(g, line, 10, C.white, 2001, { k });
  const r2 = rng(2020);
  for (let x = 60; x < 1040; x += 58 + r2() * 30) { const kk = prog(t, -.25 + (1066 - x) / 1052 * .5, .1 + (1066 - x) / 1052 * .5); if (kk <= 0) continue; const h = 20 + r2() * 26;
    chalkLine(g, [[x - 12, GY + 8], [x - 4, GY - h * .6], [x, GY + 6], [x + 6, GY - h], [x + 12, GY + 8]], 4.5, C.green, 2100 + x | 0, { k: kk, dual: false, specks: false, amp: 1 }); }
  [[150, GY + 150, C.pink], [960, GY + 120, C.yellow], [610, GY + 200, C.blue], [330, GY + 225, C.yellow], [820, GY + 230, C.pink]].forEach(([x, y, col], i) => {
    const kk = prog(t, .05 + i * .06, .35 + i * .06); if (kk <= 0) return;
    for (let p = 0; p < 5; p++) { const a = p / 5 * TAU; chalkLine(g, ell(x + Math.cos(a) * 20, y + Math.sin(a) * 20, 13, 13, 12, 0, 1), 4.5, col, 2200 + i * 9 + p, { closed: true, k: kk, dual: false }); }
    chalkFill(g, ell(x, y, 10, 10, 12), C.white, 2300 + i, { sp: 5, w: 6, a: .7 * kk });
  });
}
function drawDoodles(g, t) {
  const k = prog(t, -.25, .4);
  const cloud = (x, y, s, seed) => { const pts = []; for (let i = 0; i <= 40; i++) { const a = Math.PI + i / 40 * Math.PI; pts.push([x + Math.cos(a) * 120 * s, y + Math.sin(a) * 42 * s * (1 + .35 * Math.abs(Math.sin(a * 3.5)))]); }
    pts.push([x + 120 * s, y + 8 * s], [x - 120 * s, y + 8 * s]); chalkLine(g, pts, 5, C.blue, seed, { closed: true, k, a: .7, dual: false }); };
  cloud(200, 560, .85, 2400); cloud(900, 900, .7, 2401);
  const r = rng(2500);
  for (let i = 0; i < 9; i++) { const x = 80 + r() * 920, y = 480 + r() * 820; if (Math.abs(x - 540) < 200 || (x > 640 && y > 1000)) continue; const s = 10 + r() * 12, kk = prog(t, i * .04, .3 + i * .04);
    chalkLine(g, [[x - s, y], [x + s, y]], 3.5, i % 2 ? C.yellow : C.white, 2510 + i, { k: kk, dual: false, specks: false, amp: .6 }); chalkLine(g, [[x, y - s], [x, y + s]], 3.5, i % 2 ? C.yellow : C.white, 2530 + i, { k: kk, dual: false, specks: false, amp: .6 }); }
}
function starPos(t) { const a = starAng(t); return { x: PIV[0] + SLEN * Math.sin(a), y: PIV[1] + SLEN * Math.cos(a), a }; }
function drawStar(g, t) {
