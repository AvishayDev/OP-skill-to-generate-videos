<script>
'use strict';
// ============================================================
// 08 · SAND ANIMATION ON A LIGHTBOX
// The picture is a field of sand thickness on backlit glass (GW x GH cells, CELL world units each).
// Every sim step the story rasterises a TARGET density (sky, dunes, ground, פיצי as dark sand with
// finger-carved eyes/smile, a star wiped out of the sky, blocks with carved labels, the carved title)
// and the real sand RELAXES toward it: grainy per-cell rates + diffusion of the excess, so shapes
// flow, morph and leave trails instead of cutting. A second "loose" layer holds flicked grains that
// fly across the glass and settle. Fixed step (2 per frame), checkpoints every 8 frames: a cold seek
// re-simulates from the nearest checkpoint and gives the same bytes as a sequential render.
// Look: light = lamp * exp(-k * density) per channel (thin sand glows amber, thick is black),
// stable per-grain speckle sampled in world space, soft hand shadow, warm halation.
// ============================================================
const CELL = 3, GW = W / CELL, GH = H / CELL, NC = GW * GH, DMAX = 4;
const hash = (i, s = 0) => { let x = Math.imul(i ^ (s * 0x9E3779B1), 0x85EBCA6B); x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
function vnoise(x, y, s = 0) { const xi = Math.floor(x), yi = Math.floor(y), tx = x - xi, ty = y - yi, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const h = (a, b) => hash(Math.imul(a, 374761393) + Math.imul(b, 668265263), s);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), sx), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), sx), sy); }
const fbm = (x, y, s = 0) => vnoise(x, y, s) * .55 + vnoise(x * 2.1, y * 2.1, s + 1) * .3 + vnoise(x * 4.3, y * 4.3, s + 2) * .15;
// density -> target colour. R = sand thickness (0..DMAX), G = how eagerly the sand obeys (1 = the character, snaps fast)
const col = (d, r = .3) => `rgb(${Math.round(clamp(d / DMAX) * 255)},${Math.round(clamp(r) * 255)},0)`;
const D = { body: 2.7, block: 2.6, ground: 2.9, line: 2.4 };

// ---------- the star, the pour, the camera ----------
function myStar(t) {           // the story hides the star before .1 s; on the lightbox it is already on the table at frame 0
  if (t >= .6) return starState(t);
  const a = starState(t).ang, L = SLEN * lerp(.9, 1, eBack(prog(t, 0, .55)));
  return { visible: true, x: PIV[0] + L * Math.sin(a), y: PIV[1] + L * Math.cos(a), ang: a, lit: 0, dodge: false };
}
const sweepX = t => lerp(-220, 1400, eIO(prog(t, 0, .55)));        // a palm sweeps the heap into dunes, left to right
const cam = t => { const z = zoom(t), sh = shake(t); return { z, cx: 540 + sh * .6, cy: 760 + sh }; };
const toScreen = (C, x, y) => [C.cx + (x - 540) * C.z, C.cy + (y - 760) * C.z];

// ---------- static background target (sky, moon, dunes, ground) ----------
let BGT, TG, tg, T, RT, GM, JIT, h, L, E, F, GT;
function buildBackground() {
  BGT = mkCanvas(GW, GH); const g = BGT.getContext('2d'), im = g.createImageData(GW, GH), d = im.data;
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const wx = (i + .5) * CELL, wy = (j + .5) * CELL, k = clamp(1 - wy / 1215);
    let s = 2.15 * Math.pow(k, 1.55) * (.78 + .44 * fbm(wx / 260, wy / 200, 3));
    s += .12 * Math.max(0, fbm(wx / 90, wy / 60, 7) - .55) * k;                 // sprinkled clouds
    const q = (j * GW + i) * 4; d[q] = clamp(s / DMAX) * 255; d[q + 1] = 70; d[q + 3] = 255;
  }
  g.putImageData(im, 0, 0); g.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0); g.lineCap = 'round'; g.lineJoin = 'round';
  // moon: a crescent wiped out of the sky
  g.fillStyle = col(0, .5); g.beginPath(); g.arc(880, 470, 62, 0, TAU); g.fill();
  g.fillStyle = col(1.35, .5); g.beginPath(); g.arc(905, 450, 55, 0, TAU); g.fill();
  // pin-hole stars (fingertip dabs)
  const r = rng(51);
  for (let n = 0; n < 26; n++) { const x = 40 + r() * 1000, y = 60 + r() * 1000; if (y > 170 && y < 440) continue; if (Math.hypot(x - 540, y - 640) < 190) continue; if (Math.hypot(x - 880, y - 470) < 90) continue;
    const s = 3 + r() * 5; g.fillStyle = col(0, .5); g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
    if (s > 6) { g.strokeStyle = col(0, .5); g.lineWidth = 3; g.beginPath(); g.moveTo(x - s * 2.6, y); g.lineTo(x + s * 2.6, y); g.moveTo(x, y - s * 2.6); g.lineTo(x, y + s * 2.6); g.stroke(); } }
  // wind curls drawn with a finger
  const curl = (cx, cy, R, turns, dir) => { g.strokeStyle = col(0, .5); g.lineWidth = 7; g.beginPath(); for (let u = 0; u <= 1; u += .01) { const a = u * turns * TAU * dir, rr = R * (1 - u * .8); const x = cx + Math.cos(a) * rr - (1 - u) * R * 1.6 * dir, y = cy + Math.sin(a) * rr * .8; u ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); };
  curl(190, 830, 60, 1.2, 1); curl(930, 760, 48, 1.1, -1);
  // back dune, front dune, ground
  const hill = (pts, dens, crest) => { g.fillStyle = col(dens, .35); g.beginPath(); g.moveTo(-30, GY + 20); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W + 30, GY + 20); g.closePath(); g.fill();
    if (crest) { g.strokeStyle = col(crest, .35); g.lineWidth = 9; g.beginPath(); pts.forEach(([x, y], k) => k ? g.lineTo(x, y + 5) : g.moveTo(x, y + 5)); g.stroke(); } };
  const curve = (f) => { const p = []; for (let x = -30; x <= W + 30; x += 12) p.push([x, f(x)]); return p; };
  hill(curve(x => 1262 - 48 * Math.sin(x / 190 + .6) - 22 * Math.sin(x / 71 + 2)), .85, 1.7);
  hill(curve(x => 1420 - 40 * Math.sin(x / 160 + 2.4) - 12 * Math.sin(x / 47)), 1.35, 2.1);
  g.fillStyle = col(D.ground, .35); g.beginPath(); g.moveTo(-30, H + 30);
  for (let x = -30; x <= W + 30; x += 10) g.lineTo(x, GY + 4 * Math.sin(x / 23) + 3 * Math.sin(x / 7.3)); g.lineTo(W + 30, H + 30); g.closePath(); g.fill();
  // furrows combed into the ground
  g.strokeStyle = col(0, .35);
  [[GY + 75, 8, 0], [GY + 150, 7, 1.7], [GY + 238, 6, 3.1]].forEach(([y0, lw, ph]) => { g.lineWidth = lw; g.beginPath(); for (let x = 20; x <= W - 20; x += 10) { const y = y0 + 9 * Math.sin(x / 95 + ph); x > 20 ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); });
  const r2 = rng(61); for (let n = 0; n < 9; n++) { const x = 60 + r2() * 960, y = GY + 110 + r2() * 250; g.lineWidth = 5; g.beginPath(); g.arc(x, y, 6 + r2() * 9, 0, TAU); g.stroke(); }
}

// ---------- target: everything the story wants on the glass at time t ----------
const rrect = (w, hh, r) => { const p = new Path2D(); p.roundRect(-w / 2, -hh / 2, w, hh, r); return p; };
function starPath(R, r) { const p = new Path2D(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr = i % 2 ? r : R; i ? p.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : p.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } p.closePath(); return p; }
const STARP = starPath(STAR_R, STAR_R * .5), DIZP = starPath(34, 16);
function starT(g, t) {
  const st = myStar(t), { x, y, ang: a } = st, lit = st.lit || 0;
  g.strokeStyle = col(D.line, .9); g.lineWidth = 7; g.beginPath(); g.moveTo(PIV[0], PIV[1]);
  g.quadraticCurveTo(lerp(PIV[0], x, .5) + 8 * Math.sin(t * 2), lerp(PIV[1], y, .5), x + 80 * Math.sin(a), y - 80 * Math.cos(a)); g.stroke();
  g.save(); g.translate(x, y); g.rotate(-a);
  if (lit > 0) {                                                       // the burst: sand rushes out into a dark ring, rays wiped through it
    const R1 = 300 * eOut(lit);
    g.fillStyle = col(1.75, .7); g.beginPath(); g.arc(0, 0, R1, 0, TAU); g.fill();
    g.strokeStyle = col(0, .8); g.lineCap = 'round';
    for (let i = 0; i < 14; i++) { const ra = i / 14 * TAU + t * .35, r1 = R1 * (i % 2 ? .82 : .97); g.lineWidth = i % 2 ? 10 : 16; g.beginPath(); g.moveTo(Math.cos(ra) * 140, Math.sin(ra) * 140); g.lineTo(Math.cos(ra) * r1, Math.sin(ra) * r1); g.stroke(); }
    g.fillStyle = col(0, .8); g.beginPath(); g.arc(0, 0, 160 * eOut(lit), 0, TAU); g.fill();
    const rr = rng(Math.floor(t * 12) + 5);                            // pin-hole sparkles in the ring
    for (let i = 0; i < 10; i++) { const aa = rr() * TAU, dd = 180 + rr() * (R1 - 180); if (dd > R1 - 20) continue; const px = Math.cos(aa) * dd, py = Math.sin(aa) * dd, s = 5 + rr() * 7;
      g.lineWidth = 4; g.beginPath(); g.moveTo(px - s * 2, py); g.lineTo(px + s * 2, py); g.moveTo(px, py - s * 2); g.lineTo(px, py + s * 2); g.stroke(); }
  }
  const pulse = 1 + .04 * Math.sin(t * 5) + .14 * lit * Math.exp(-Math.max(0, t - LEAP.t1) * 3); g.scale(pulse, pulse);
  g.lineJoin = 'round'; g.fillStyle = col(0, .9); g.fill(STARP);
  g.strokeStyle = col(2.7, .9); g.lineWidth = 15; g.stroke(STARP);
  g.fillStyle = col(1.0, .9); g.beginPath(); g.ellipse(-31, 16, 12, 7, 0, 0, TAU); g.ellipse(31, 16, 12, 7, 0, 0, TAU); g.fill();   // blush: thin sand glows amber
  g.strokeStyle = col(2.6, .9); g.fillStyle = col(2.7, .9); g.lineCap = 'round'; g.lineWidth = 10;
  if (lit > 0) { g.beginPath(); g.arc(-20, -6, 9, 0, TAU); g.arc(20, -6, 9, 0, TAU); g.fill(); g.fillStyle = col(0, .9); g.beginPath(); g.arc(-17, -9, 3.5, 0, TAU); g.arc(23, -9, 3.5, 0, TAU); g.fill();
    g.fillStyle = col(2.7, .9); g.beginPath(); g.arc(0, 12, 14, 0, Math.PI); g.fill(); }
  else if (st.dodge) { g.beginPath(); g.arc(-12, -5, 8, 0, TAU); g.arc(28, -5, 8, 0, TAU); g.fill(); g.beginPath(); g.moveTo(-4, 18); g.lineTo(12, 13); g.stroke(); }
  else { g.beginPath(); g.moveTo(-34, -6); g.quadraticCurveTo(-21, 7, -8, -6); g.moveTo(8, -6); g.quadraticCurveTo(21, 7, 34, -6); g.moveTo(-12, 16); g.quadraticCurveTo(0, 28, 12, 16); g.stroke(); }
  g.restore();
}
function blockT(g, i, t) {
  const b = blockState(i, t); if (!b.visible) return;
  g.save(); g.translate(b.x, b.bottom); g.rotate(b.rot); g.scale(1 + b.sq * .6, 1 - b.sq); g.translate(0, -b.h / 2);
  g.fillStyle = col(0, 1); g.fill(rrect(b.w + 26, b.h + 26, 32));
  g.fillStyle = col(D.block, 1); g.fill(rrect(b.w, b.h, 22));
  g.strokeStyle = col(0, 1); g.lineWidth = 6; g.stroke(rrect(b.w - 36, b.h - 36, 12));
  g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '800 78px Heebo'; g.fillStyle = col(0, 1); g.fillText(b.label, 0, -46);
  g.beginPath(); g.arc(0, 50, 46, 0, TAU); g.fill();
  g.font = '900 72px Heebo'; g.fillStyle = col(2.9, 1); g.fillText(b.n, 0, 55);
  g.strokeStyle = col(0, 1); g.lineWidth = 6; g.lineCap = 'round';
  [-1, 1].forEach(sd => { g.beginPath(); for (let x = 62; x <= 96; x += 4) { const y = 50 + 5 * Math.sin(x / 6); x > 62 ? g.lineTo(sd * x, y) : g.moveTo(sd * x, y); } g.stroke(); });
  g.restore();
}
function pitzT(g, s, t) {
  const sc = s.sc; if (sc <= 0) return;
  g.save(); g.translate(s.x, s.y); g.rotate(s.rot); g.scale(s.sx * sc, s.sy * sc); g.lineCap = 'round'; g.lineJoin = 'round';
  const arms = [[-1, s.armL], [1, s.armR]].map(([sd, a]) => { const sh = [sd * 72, -118], hd = [sh[0] + sd * Math.sin(a) * 96, sh[1] + Math.cos(a) * 96]; return { sh, hd, el: [lerp(sh[0], hd[0], .5) + sd * 8, lerp(sh[1], hd[1], .5) + 6] }; });
  const legs = [[-1, 0], [1, 1]].map(([sd, n]) => { const sw = s.legs ? Math.sin(s.legs + n * Math.PI) * 18 : 0; return { sd, hip: [sd * 34, -34], ft: [sd * 42 + sw, -2 + Math.abs(sw) * .2] }; });
  const body = new Path2D(); body.ellipse(0, -128, 102, 94, 0, 0, TAU);
  for (const pass of [0, 1]) {          // pass 0: a finger wipes a halo of light around the figure; pass 1: the sand figure
    const c = pass ? col(D.body, 1) : col(0, 1), ex = pass ? 0 : 13;
    g.strokeStyle = c; g.fillStyle = c;
    for (const A of arms) { g.lineWidth = 16 + ex * 2; g.beginPath(); g.moveTo(...A.sh); g.quadraticCurveTo(...A.el, ...A.hd); g.stroke(); g.beginPath(); g.arc(A.hd[0], A.hd[1], 18 + ex, 0, TAU); g.fill(); }
    for (const Lg of legs) { g.lineWidth = 16 + ex * 2; g.beginPath(); g.moveTo(...Lg.hip); g.lineTo(...Lg.ft); g.stroke(); g.beginPath(); g.ellipse(Lg.ft[0] + Lg.sd * 8, Lg.ft[1], 28 + ex, 14 + ex, 0, 0, TAU); g.fill(); }
    if (!pass) { g.lineWidth = ex * 2; g.stroke(body); }
    g.fill(body);
  }
  // thinner sand = form: a glowing rim-light crescent and amber cheeks
  g.fillStyle = col(1.55, 1); g.beginPath(); g.ellipse(-48, -178, 36, 15, -.62, 0, TAU); g.fill();
  g.fillStyle = col(.95, 1); g.beginPath(); g.ellipse(-66, -106, 19, 11, 0, 0, TAU); g.ellipse(66, -106, 19, 11, 0, 0, TAU); g.fill();
  if (false && s.band > 0) { g.save(); g.translate(-40, -196); g.rotate(-.45); const bs = eBack(s.band); g.scale(bs, bs); g.fillStyle = col(0, 1); g.fill(rrect(96, 38, 12)); g.fillStyle = col(1.2, 1); g.fill(rrect(82, 26, 8)); g.fillStyle = col(0, 1); g.fill(rrect(26, 26, 4)); g.restore(); }
  // eyes: wiped down to the glass, pupils dropped back in
  const jx = Math.sin(t * 37) * s.jig * 7, jy = Math.cos(t * 29) * s.jig * 6, cv = col(0, 1), dk = col(2.9, 1);
  g.strokeStyle = cv; g.fillStyle = cv;
  [-1, 1].forEach(sd => {
    const ex = sd * 38, ey = -152;
    if (s.eyes === 'x') { g.lineWidth = 10; g.beginPath(); g.moveTo(ex - 15, ey - 15); g.lineTo(ex + 15, ey + 15); g.moveTo(ex + 15, ey - 15); g.lineTo(ex - 15, ey + 15); g.stroke(); return; }
    if (s.eyes === 'happy') { g.lineWidth = 10; g.beginPath(); g.moveTo(ex - 19, ey + 7); g.quadraticCurveTo(ex, ey - 22, ex + 19, ey + 7); g.stroke(); return; }
    const R = s.eyes === 'big' || s.eyes === 'spark' ? 34 : 30, pr = s.eyes === 'spark' ? 19 : s.eyes === 'big' ? 13 : 15;
    g.fillStyle = cv; g.beginPath(); g.arc(ex, ey, R, 0, TAU); g.fill();
    const px = ex + clamp(s.look[0] * 11 + jx, -12, 12), py = ey + clamp(s.look[1] * 11 + jy, -12, 12);
    g.fillStyle = dk; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
    g.fillStyle = cv; g.beginPath(); g.arc(px + 5, py - 6, s.eyes === 'spark' ? 7 : 5.5, 0, TAU); g.fill();
    if (s.eyes === 'spark') { g.beginPath(); g.arc(px - 7, py + 7, 3.5, 0, TAU); g.fill(); }
  });
  g.strokeStyle = cv; g.lineWidth = 9;
  if (s.brow === 'det') { g.beginPath(); g.moveTo(-64, -200); g.lineTo(-20, -188); g.moveTo(64, -200); g.lineTo(20, -188); g.stroke(); }
  const my = -100; g.lineWidth = 9; g.fillStyle = cv; g.beginPath();
  if (s.mouth === 'smile') { g.moveTo(-26, my - 5); g.quadraticCurveTo(0, my + 22, 26, my - 5); g.stroke(); }
  else if (s.mouth === 'flat') { g.moveTo(-18, my + 2); g.lineTo(18, my); g.stroke(); }
  else if (s.mouth === 'tiny') { g.ellipse(0, my + 2, 10, 12, 0, 0, TAU); g.fill(); }
  else if (s.mouth === 'ouch') { g.moveTo(-27, my); g.lineTo(-13, my - 9); g.lineTo(0, my + 2); g.lineTo(13, my - 9); g.lineTo(27, my); g.stroke(); }
  else if (s.mouth === 'open' || s.mouth === 'wow') {
    const w = s.mouth === 'wow' ? 31 : 17, hh = s.mouth === 'wow' ? 30 : 21;
    if (s.mouth === 'wow') { g.moveTo(-w, my - 7); g.quadraticCurveTo(0, my + hh * 1.7, w, my - 7); g.closePath(); } else g.ellipse(0, my + 4, w, hh, 0, 0, TAU);
    g.fill(); g.fillStyle = col(1.1, 1); g.beginPath(); g.ellipse(0, my + hh * .95, w * .6, hh * .38, 0, 0, TAU); g.fill();
  }
  g.restore();
}
function dizzyT(g, x, y, t, k) {
  if (k <= 0) return;
  for (let i = 0; i < 3; i++) { const a = t * 5 + i / 3 * TAU, px = x + Math.cos(a) * 118, py = y + Math.sin(a) * 28, s = k * (Math.sin(a) > 0 ? 1.1 : .85);
    g.save(); g.translate(px, py); g.rotate(a); g.scale(s, s); g.lineJoin = 'round';
    g.strokeStyle = col(0, 1); g.lineWidth = 16; g.stroke(DIZP); g.fillStyle = col(2.6, 1); g.fill(DIZP); g.restore(); }
}
function bangT(g, s, t) {
  if (t < IDEA.t0 || t > IDEA.t1) return;
  const k = eBack(prog(t, IDEA.t0, IDEA.t0 + .2)) * (1 - prog(t, IDEA.t1 - .15, IDEA.t1));
  g.save(); g.translate(s.x + 40, s.y - 330 * s.sy); g.rotate(.12); g.scale(k, k);
  g.fillStyle = col(0, 1); g.beginPath(); g.arc(0, 0, 84, 0, TAU); g.fill();
  g.fillStyle = col(2.7, 1); g.beginPath(); g.arc(0, 0, 70, 0, TAU); g.fill();
  g.font = '900 112px Heebo'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col(0, 1); g.fillText('!', 0, 6);
  g.strokeStyle = col(2.5, 1); g.lineWidth = 11; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const a = -Math.PI * .92 + i * .46; g.beginPath(); g.moveTo(Math.cos(a) * 100, Math.sin(a) * 100); g.lineTo(Math.cos(a) * 134, Math.sin(a) * 134); g.stroke(); }
  g.restore();
}
// title: sand flows into a band, then a fingertip writes the words out of it, right to left
let TT = null;
function titleGeom() {
  if (TT) return TT; tg.save(); let size = 150; tg.font = `800 ${size}px Heebo`; const w0 = tg.measureText(TITLE.text).width; size = Math.min(150, size * 840 / w0);
  tg.font = `800 ${size}px Heebo`; const tw = tg.measureText(TITLE.text).width; tg.restore(); TT = { size, tw }; return TT;
}
const TW0 = TITLE.t0 + .06, TW1 = TITLE.t0 + .72;
function titleT(g, t) {
  const kb = eOut(prog(t, TITLE.t0 - .1, TITLE.t0 + .18)); if (kb <= 0) return;
  const { size, tw } = titleGeom(), y = TITLE.y;
  g.save(); g.fillStyle = col(2.55, .8); g.beginPath(); g.ellipse(540, y, (tw / 2 + 95) * (.35 + .65 * kb), 118 * kb, 0, 0, TAU); g.fill();
  const kw = prog(t, TW0, TW1); if (kw > 0) {
    const xr = 540 + tw / 2 + 20; g.beginPath(); g.rect(xr - (tw + 40) * kw, y - size, (tw + 40) * kw + 30, size * 2); g.clip();
    g.font = `800 ${size}px Heebo`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col(0, 1); g.fillText(TITLE.text, 540, y + size * .04);
  }
  g.restore();
  const ku = prog(t, TW1, TW1 + .3); if (ku > 0) { g.strokeStyle = col(0, 1); g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); const x0 = 540 + tw * .42, x1 = lerp(x0, 540 - tw * .42, eOut(ku));
    for (let k = 0; k <= 30; k++) { const x = lerp(x0, x1, k / 30), yy = y + size * .62 + 7 * Math.sin(x / 40); k ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke(); }
}
function buildTarget(t) {
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalAlpha = 1; tg.drawImage(BGT, 0, 0);
  tg.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0); tg.lineCap = 'round'; tg.lineJoin = 'round';
  starT(tg, t);
  blockT(tg, 0, t); blockT(tg, 1, t);
  const s = pose(t);
  if (t < .62) {                                      // sand gathers into a heap, the heap stands up as פיצי
    const k = eOut(prog(t, .1, .34)) * (1 - prog(t, .4, .6));
