<script>
'use strict';
// ============================================================
// 01 · BRUSH STROKES - thick painterly gouache / oil impasto, Loving-Vincent energy.
// Everything is built from ONE primitive: brush() = a tapered ribbon along a path, filled with
// parallel bristle lines of drifting colour/alpha, dry-brush breakup at the tail, and an impasto
// ridge (light edge + dark edge). Sky = strokes following a swirling flow field (3 pre-painted
// variants that boil), foreground re-painted on twos. Voice: felt piano, string pad, brushed snare.
// ============================================================
let BF = 0;                                              // boil frame (changes every 2 frames)
const bs = k => (k * 7919 + BF * 104729) | 0;           // boiling seed
const hsl = (h, s, l) => `hsl(${h | 0},${clamp(s, 0, 100) | 0}%,${clamp(l, 0, 100) | 0}%)`;

// ---------- palette (hsl triplets) ----------
const P_ = {
  verm: [8, 82, 50], vermD: [4, 72, 38], peach: [18, 95, 68], crim: [350, 62, 36],
  outl: [228, 62, 16], cream: [45, 70, 93], yel: [48, 96, 56], yelD: [36, 95, 48], blush: [345, 85, 72],
  ultra: [228, 64, 22], cobalt: [218, 60, 40], teal: [192, 45, 48], white: [205, 45, 88],
};

// ---------- the brush ----------
function crSample(P, n) {
  const out = [], segs = P.length - 1;
  for (let i = 0; i <= n; i++) {
    const u = i / n * segs, s = Math.min(segs - 1, Math.floor(u)), f = u - s, f2 = f * f, f3 = f2 * f;
    const p0 = P[Math.max(0, s - 1)], p1 = P[s], p2 = P[s + 1], p3 = P[Math.min(segs, s + 2)];
    const cr = k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * f + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * f2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * f3);
    out.push([cr(0), cr(1)]);
  }
  return out;
}
// brush(g, points, width, [h,s,l], seed, opts). Points are control points (Catmull-Rom) or raw samples.
function brush(g, P, w, col, seed, o = {}) {
  const { a = 1, nb = 0, dry = .35, tin = .15, tout = .32, hi = .8, upto = 1, raw = false, jit = 0, lj = 8, hj = 6, sj = 10, base = .9 } = o;
  const r = rng(seed);
  let Q = P;
  if (jit) { const rj = rng(seed * 13 + 5); Q = P.map(p => [p[0] + (rj() - .5) * 2 * jit, p[1] + (rj() - .5) * 2 * jit]); }
  let S_;
  if (raw) S_ = Q;
  else {
    let L = 0; for (let i = 1; i < Q.length; i++) L += Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]);
    S_ = crSample(Q.length > 2 ? Q : [Q[0], [(Q[0][0] + Q[1][0]) / 2, (Q[0][1] + Q[1][1]) / 2], Q[1]], clamp(Math.round(L / 9), 4, 40));
  }
  const n = S_.length - 1; if (n < 1) return;
  const N = [], WW = [];
  for (let i = 0; i <= n; i++) {
    const p = S_[Math.max(0, i - 1)], q = S_[Math.min(n, i + 1)], tx = q[0] - p[0], ty = q[1] - p[1], l = Math.hypot(tx, ty) || 1;
    N.push([-ty / l, tx / l]);
    const u = i / n; WW.push(w * (.55 + .45 * clamp(u / tin)) * (u > 1 - tout ? .2 + .8 * Math.pow(Math.max(0, (1 - u) / tout), .6) : 1));
  }
  const mN = N[n >> 1], ls = (mN[0] * -.6 + mN[1] * -.8) >= 0 ? 1 : -1;     // which side faces the light (upper left)
  const m = Math.max(1, Math.round(n * clamp(upto)));
  const edge = (off, i) => [S_[i][0] + N[i][0] * WW[i] * off, S_[i][1] + N[i][1] * WW[i] * off];
  if (base) {                                              // body of paint
    g.globalAlpha = a * base; g.fillStyle = hsl(col[0], col[1], col[2]); g.beginPath();
    for (let i = 0; i <= m; i++) { const e = edge(.42, i); g.lineTo(e[0], e[1]); }
    for (let i = m; i >= 0; i--) { const e = edge(-.42, i); g.lineTo(e[0], e[1]); }
    g.closePath(); g.fill();
  }
  const cnt = nb || clamp(Math.round(w / 3.2), 3, 14);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let j = 0; j < cnt; j++) {                          // bristles
    const off = (((j + .5) / cnt) * 2 - 1) * .5 * .94 + (r() - .5) * .05;
    g.strokeStyle = hsl(col[0] + (r() - .5) * 2 * hj, col[1] + (r() - .5) * sj, col[2] + (r() - .5) * 2 * lj + off * 2 * ls * lj * .5);
    g.globalAlpha = a * (.5 + r() * .5);
    g.lineWidth = Math.max(.8, w / cnt * (1 + r() * .9));
    const uEnd = 1 - r() * dry * (.5 + Math.abs(off)), u0 = r() * .05;
    g.beginPath(); let on = false;
    for (let i = 0; i <= m; i++) {
      const u = i / n; if (u < u0 || u > uEnd) { on = false; continue; }
      if (u > .55 && r() < dry * .45) { on = false; continue; }      // dry-brush skips
      const e = edge(off, i); if (on) g.lineTo(e[0], e[1]); else { g.moveTo(e[0], e[1]); on = true; }
    }
    g.stroke();
  }
  if (hi > 0) {                                            // impasto ridge: light edge + dark edge
    const ridge = (off, dl, al, lw, end) => {
      g.strokeStyle = hsl(col[0], col[1] - 8, col[2] + dl); g.globalAlpha = a * al; g.lineWidth = Math.max(1, lw);
      g.beginPath(); let on = false;
      for (let i = 0; i <= Math.min(m, Math.round(n * end)); i++) { const e = edge(off, i); if (on) g.lineTo(e[0], e[1]); else { g.moveTo(e[0], e[1]); on = true; } }
      g.stroke();
    };
    ridge(.3 * ls, 24, .75 * hi, w * .09, .7 + r() * .2);
    ridge(-.4 * ls, -16, .45 * hi, w * .08, .85);
  }
  g.globalAlpha = 1;
}
// ring of arcs around an ellipse (painted outline)
function ring(g, cx, cy, rx, ry, w, col, seed, n = 6, o = {}) {
  const r = rng(seed);
  for (let k = 0; k < n; k++) {
    const a0 = k / n * TAU + (r() - .5) * .3, da = TAU / n * 1.3, P = [];
    for (let q = 0; q < 4; q++) { const a = a0 + da * q / 3; P.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
    brush(g, P, w, col, bs(seed * 17 + k), { nb: 3, hi: 0, dry: .15, tin: .1, tout: .2, jit: .8, lj: 5, ...o });
  }
}
// dab: a small painted oval (underpaint + two strokes + outline)
function dab(g, x, y, rx, ry, col, seed, outline = true, ow = 4) {
  g.fillStyle = hsl(...col); g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();
  brush(g, [[x - rx * .8, y - ry * .2], [x, y - ry * .45], [x + rx * .8, y - ry * .1]], ry * .9, [col[0], col[1], col[2] + 8], bs(seed), { hi: .6, dry: .2 });
  brush(g, [[x - rx * .7, y + ry * .35], [x + rx * .6, y + ry * .4]], ry * .7, [col[0], col[1], col[2] - 7], bs(seed + 1), { hi: 0, dry: .2 });
  if (outline) ring(g, x, y, rx + 1, ry + 1, ow, P_.outl, seed + 2, 4);
}
function starPts(R, r, seed) { const q = rng(seed), pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr = (i % 2 ? r : R) * (1 + (q() - .5) * .06); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }
function polyPath(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }

// ---------- painted text (mask filled with strokes) ----------
function paintedText(str, size, family, fill, seed, o = {}) {
  const { fat = 8, edgeW = 0, edge = P_.outl, sw = 12, pad = 26, lj = 12, hj = 8, weight = '' } = o;
  const font = `${weight} ${size}px ${family}`.trim();
  ctx.save(); ctx.font = font; const tw = ctx.measureText(str).width; ctx.restore();
  const w = Math.ceil(tw + pad * 2 + fat + edgeW), h = Math.ceil(size * 1.6 + pad * 2);
  const txt = (g, lw, col) => { g.font = font; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = g.strokeStyle = col; g.lineJoin = 'round';
    g.fillText(str, w / 2, h / 2); if (lw) { g.lineWidth = lw; g.strokeText(str, w / 2, h / 2); } };
  const mask = layer(g => txt(g, fat, '#fff'), w, h);
  const paint = layer(g => {
    g.fillStyle = hsl(...fill); g.fillRect(0, 0, w, h); const r = rng(seed);
    for (let y = 0; y < h; y += sw * .75) for (let x = -20; x < w; x += sw * 2) {
      const x0 = x + r() * sw, y0 = y + r() * sw * .6, an = -.55 + (r() - .5) * .6, L = sw * (2.2 + r() * 1.6);
      brush(g, [[x0, y0], [x0 + Math.cos(an) * L * .5, y0 + Math.sin(an) * L * .5 + (r() - .5) * 4], [x0 + Math.cos(an) * L, y0 + Math.sin(an) * L]], sw, fill,
        (seed * 1000 + x * 7 + y * 131) | 0, { lj, hj, base: .5, dry: .25, hi: .7 });
    }
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0);
  }, w, h);
  const cv = layer(g => { if (edgeW) txt(g, fat + edgeW, hsl(...edge)); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(paint, 0, 0); }, w, h);
  return { cv, w, h };
}

// ============================================================
// BACKGROUND: swirling night sky, moon, stars, hills, cypress, meadow (3 boil variants)
// ============================================================
const VORT = [{ x: 290, y: 1010, R: 250, s: 1.7, d: 1 }, { x: 730, y: 1240, R: 190, s: 1.5, d: -1 }, { x: 905, y: 700, R: 170, s: 1.3, d: 1 }, { x: 540, y: 150, R: 260, s: .7, d: -1 }];
function field(x, y) {
  let vx = 1, vy = .35 * Math.sin(x * .004 + y * .007) + .15 * Math.sin(y * .013);
  for (const v of VORT) { const dx = x - v.x, dy = y - v.y, d = Math.hypot(dx, dy) + 1, e = Math.exp(-((d / v.R) ** 2)) * v.s * 2.2; vx += -dy / d * e * v.d; vy += dx / d * e * v.d; }
  const l = Math.hypot(vx, vy) || 1; return [vx / l, vy / l];
}
const MOON = [905, 700], SMALL_STARS = [[150, 640, 24], [330, 480, 18], [1010, 960, 20], [640, 930, 15], [60, 300, 16], [1030, 250, 16], [210, 1330, 14], [960, 1330, 13]];
const hillY = x => 1455 + 38 * Math.sin(x * .006 + 1) + 22 * Math.sin(x * .017 + 2);
function paintBG(g, v) {
  BF = v * 3 + 1;
  const P = rng(1000);                                    // positions: same in every variant
  // --- sky underpaint
  const gr = g.createLinearGradient(0, 0, 0, 1500);
  gr.addColorStop(0, hsl(230, 62, 17)); gr.addColorStop(.45, hsl(222, 58, 32)); gr.addColorStop(1, hsl(205, 45, 50));
  g.fillStyle = gr; g.fillRect(0, 0, W, 1520);
  // --- flow-field sky strokes (two passes: broad, then fine + light swirl bands)
  const skyCol = (x, y, rr) => {
    let white = .06;
    for (const vv of VORT) { const d = Math.hypot(x - vv.x, y - vv.y), e = Math.exp(-((d / vv.R) ** 2) * 1.1); white += .6 * e * clamp(Math.sin(d / vv.R * 10) * 1.4 - .2); }
    const k = clamp(y / 1480);
    if (rr() < white) return rr() < .5 ? [205 + rr() * 15, 50, 80 + rr() * 12] : [190, 45, 66];
    if (rr() < .1) return [175, 40, 44];
    return [lerp(230, 205, k) + (rr() - .5) * 10, lerp(62, 48, k), lerp(20, 50, k) + (rr() - .5) * 14];
  };
  for (let pass = 0; pass < 2; pass++) {
    const count = pass ? 1300 : 2300, cr = rng(2000 + pass * 17 + v * 3);
    for (let k = 0; k < count; k++) {
      let x = P() * (W + 60) - 30, y = P() * 1520 - 20;
      x += (cr() - .5) * 5; y += (cr() - .5) * 5;
      const pts = [[x, y]], steps = 6 + (P() * 4 | 0), st = pass ? 8 : 10;
      for (let s = 0; s < steps; s++) { const f = field(pts[s][0], pts[s][1]); pts.push([pts[s][0] + f[0] * st, pts[s][1] + f[1] * st]); }
      brush(g, pts, pass ? 11 + P() * 5 : 18 + P() * 9, skyCol(x, y, cr), bs(k + pass * 5000), { raw: true, dry: .45, hi: .7 });
    }
  }
  // --- moon + halo rings, small stars with halos
  const halo = (x, y, r0, nR, gap, seed, w) => {
    for (let j = 0; j < nR; j++) { const rr = r0 + j * gap, n = Math.max(4, Math.round(rr / 16));
      ring(g, x, y, rr, rr, w, j % 2 ? [55, 90, 86] : [50, 85, 62], seed + j * 11, n, { nb: 6, hi: .7, dry: .55, a: .9, lj: 12, base: .5, jit: 2.5 }); }
  };
  halo(MOON[0], MOON[1], 78, 4, 24, 3100, 16);
  g.fillStyle = hsl(44, 95, 58); g.beginPath(); g.arc(MOON[0], MOON[1], 56, 0, TAU); g.fill();
  for (let k = 0; k < 7; k++) { const a = -1.2 + k * .38; brush(g, [[MOON[0] + Math.cos(a) * 48, MOON[1] + Math.sin(a) * 48], [MOON[0] + Math.cos(a + 1.3) * 30, MOON[1] + Math.sin(a + 1.3) * 30], [MOON[0] + Math.cos(a + 2.4) * 44, MOON[1] + Math.sin(a + 2.4) * 44]], 18, k % 2 ? [48, 95, 70] : [38, 95, 52], bs(3200 + k)); }
  // crescent shadow
  g.fillStyle = hsl(222, 55, 30); g.globalAlpha = .9; g.beginPath(); g.arc(MOON[0] + 30, MOON[1] - 18, 46, 0, TAU); g.fill(); g.globalAlpha = 1;
  for (let k = 0; k < 4; k++) brush(g, [[MOON[0] + 4, MOON[1] - 50 + k * 22], [MOON[0] + 40, MOON[1] - 40 + k * 22], [MOON[0] + 70, MOON[1] - 30 + k * 18]], 16, [222, 55, 30 + k * 3], bs(3300 + k), { hi: .4 });
  SMALL_STARS.forEach(([x, y, s], i) => {
    halo(x, y, s * 1.7, 2, s * .9, 3400 + i * 30, 9);
    g.fillStyle = hsl(52, 95, 80); g.beginPath(); g.arc(x, y, s * .8, 0, TAU); g.fill();
    for (let k = 0; k < 4; k++) { const a = k * .8 + i; brush(g, [[x - Math.cos(a) * s, y - Math.sin(a) * s], [x + Math.cos(a) * s, y + Math.sin(a) * s]], s * .6, k % 2 ? [55, 90, 94] : [48, 95, 66], bs(3500 + i * 9 + k), { hi: .3 }); }
  });
  // --- distant hills
  g.fillStyle = hsl(232, 32, 30); g.beginPath(); g.moveTo(0, GY); for (let x = 0; x <= W; x += 20) g.lineTo(x, hillY(x)); g.lineTo(W, GY + 10); g.lineTo(0, GY + 10); g.fill();
  for (let k = 0; k < 150; k++) {
    const x = P() * (W + 80) - 40, y0 = hillY(x), y = y0 + 8 + P() * (GY - y0), L = 60 + P() * 70, P1 = [];
    for (let q = 0; q < 3; q++) { const xx = x + q * L / 2; P1.push([xx, y + (hillY(xx) - y0) * (1 - (y - y0) / (GY - y0 + 1))]); }
    const top = y - y0 < 22;
    brush(g, P1, 16 + P() * 6, top ? [245, 30, 50] : [228 + P() * 12, 35, 24 + P() * 12], bs(4000 + k), { hi: .5 });
  }
  // --- cypress (flame of dark green vertical strokes)
  const CX = 108, CT = 790, hw = y => { const u = (GY - y) / (GY - CT); return 78 * Math.pow(1 - u, .7) * Math.min(1, u * 5 + .35); };
  g.fillStyle = hsl(150, 40, 12); g.beginPath();
  for (let y = GY; y >= CT; y -= 20) g.lineTo(CX - hw(y) + 8 * Math.sin(y * .03), y);
  for (let y = CT; y <= GY; y += 20) g.lineTo(CX + hw(y) + 8 * Math.sin(y * .03 + 1), y);
  g.fill();
  for (let k = 0; k < 170; k++) {
    const y = CT + 20 + P() * (GY - CT - 10), hwy = hw(y), x = CX + (P() * 2 - 1) * hwy * .9, L = 70 + P() * 60, sd = P() < .5 ? 1 : -1, P1 = [];
    for (let q = 0; q < 4; q++) { const yy = y - L * q / 3; P1.push([x + sd * 10 * Math.sin(q * 1.4) + (CX - x) * .25 * q / 3, yy]); }
    const pick = P(); const col = pick < .12 ? [210, 40, 26] : pick < .3 ? [95, 38, 34] : [148 + P() * 20, 38, 12 + P() * 16];
    brush(g, P1, 13 + P() * 6, col, bs(4500 + k), { hi: .7, tin: .3 });
  }
  // --- meadow
  g.fillStyle = hsl(84, 42, 30); g.fillRect(0, GY - 8, W, H - GY + 8);
  for (let y = GY - 4, row = 0; y < H + 20; y += 15, row++) {
    for (let x = -60 + P() * 60; x < W + 40; x += 70 + P() * 50) {
      const L = 90 + P() * 70, sl = (P() - .5) * .18, P1 = [[x, y], [x + L * .5, y + L * sl * .5 - 5 * Math.sin(x * .02)], [x + L, y + L * sl]];
      const pick = P(), dk = clamp((y - GY) / 340);
      const col = pick < .1 ? [44, 62, 56] : pick < .22 ? [70, 55, 52 - dk * 10] : pick < .45 ? [110, 40, 24 - dk * 5] : [80 + P() * 14, 44, 36 - dk * 10];
      brush(g, P1, 17 + P() * 8, col, bs(5000 + row * 40 + (x | 0)), { hi: .7 });
    }
  }
  for (let k = 0; k < 140; k++) {                         // grass flicks on the horizon
    const x = P() * W, y = GY + 6 + P() * 14, L = 22 + P() * 30, lean = (P() - .5) * 20;
    brush(g, [[x, y], [x + lean * .5, y - L * .6], [x + lean, y - L]], 7 + P() * 3, P() < .3 ? [75, 55, 56] : [95, 45, 36], bs(6000 + k), { hi: .5, tin: .05 });
  }
  [[90, GY + 150], [990, GY + 110], [600, GY + 250], [300, GY + 290], [820, GY + 290], [470, GY + 120]].forEach(([x, y], i) => {
    for (let p = 0; p < 5; p++) { const a = p / 5 * TAU + i; brush(g, [[x, y], [x + Math.cos(a) * 22, y + Math.sin(a) * 16]], 12, i % 2 ? [50, 95, 64] : [40, 30, 94], bs(6500 + i * 9 + p), { hi: .4, tin: .05 }); }
    g.fillStyle = hsl(20, 80, 45); g.beginPath(); g.arc(x, y, 7, 0, TAU); g.fill();
  });
}
// canvas-weave texture (pixel space, overlay blend)
const WEAVE = (() => {
  const n = 180, c = mkCanvas(n, n), g = c.getContext('2d'), r = rng(55);
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, n, n);
  for (let y = 0; y < n; y += 3) { const v = r() < .5 ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${.05 + r() * .08})`; g.fillRect(0, y, n, 1.3); }
  for (let x = 0; x < n; x += 3) { const v = r() < .5 ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${.04 + r() * .07})`; g.fillRect(x, 0, 1.3, n); }
  for (let i = 0; i < 1400; i++) { const v = r() < .5 ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${.05 + r() * .1})`; g.fillRect(r() * n, r() * n, 1 + r() * 2, 1); }
  return c;
})();

// ============================================================
// פיצי - painted with strokes that wrap the round body
// ============================================================
const BODYS = (() => {
  const r = rng(501), out = [];
  for (let k = 0; k < 46; k++) {
    const rr = .16 + .86 * Math.sqrt(r()), a0 = r() * TAU, len = 70 + r() * 55, da = Math.min(2.2, len / (rr * 100)) * (r() < .5 ? 1 : -1), P = [];
    for (let q = 0; q < 4; q++) { const a = a0 + da * q / 3, rq = rr * (1 + (r() - .5) * .08); P.push([Math.cos(a) * BODY.rx * rq, BODY.cy + Math.sin(a) * BODY.ry * rq]); }
    const am = a0 + da / 2, sh = -.55 * Math.cos(am) * rr - .8 * Math.sin(am) * rr;
    let col, ord;
    if (sh > .38) { col = [18 + r() * 10, 96, 66 + sh * 8]; ord = 2; }
    else if (sh < -.3) { col = r() < .4 ? P_.crim : [3, 76, 37]; ord = 0; }
    else { col = [6 + r() * 8, 86, 50 + sh * 8 + (r() - .5) * 8]; ord = 1; }
    out.push({ P, w: 25 + r() * 11, col, ord, seed: 520 + k, a: 1 });
  }
  for (let k = 0; k < 5; k++) { const cx = -44 + (r() - .5) * 40, cy = -186 + (r() - .5) * 20, a = -.5 + r() * .4;

    const z = zoom(t), sh = shake(tf);
    c.fillStyle = hsl(228, 60, 18); c.fillRect(0, 0, W, H);
    c.save(); c.translate(540 + sh * .6, 760 + sh); c.scale(z, z); c.translate(-540, -760);
    c.drawImage(L_BG[Math.floor(i / 3) % 3], -12, -12, W + 24, H + 24);   // painted world boils on threes
    drawStar(c, t);
    drawBlock(c, 0, t); drawBlock(c, 1, t);
    paintDust(c, TOWER.x, GY, t, BLOCKS[0].land, 1.2); paintDust(c, TOWER.x, blockTop(0), t, BLOCKS[1].land, 1.2);
    SPLATS.forEach(te => { paintDust(c, HX, GY, t, te, 1.4); splash(c, HX, GY - 10, t, te); });
    const s = pose(t);
    pitz(c, s, t);
    dizzy(c, s.x, s.y - 250 * s.sy * s.sc, t, s.dizzy);
    bang(c, s, t);
    flecks(c, t);
    c.restore();
    drawTitle(c, t);
    // canvas weave + soft vignette, in pixel space
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'overlay'; c.globalAlpha = .55; c.fillStyle = c.createPattern(WEAVE, 'repeat'); c.fillRect(0, 0, OUT_W, OUT_H);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const vg = c.createRadialGradient(OUT_W / 2, OUT_H * .45, OUT_W * .45, OUT_W / 2, OUT_H * .5, OUT_H * .75);
    vg.addColorStop(0, 'rgba(10,12,30,0)'); vg.addColorStop(1, 'rgba(10,12,30,.35)'); c.fillStyle = vg; c.fillRect(0, 0, OUT_W, OUT_H);
    c.restore();
  },
  kit: { reverb: .32, musicGain: .55, sfxGain: .8, revSec: 2.2 },
  voice: K => {
    const { osc, noise, mf, nm, at } = K;
    const piano = (t, m, v = .1, d = 1.2, out = K.music) => { const f = mf(m);            // felt piano: detuned sines, fast decay, hammer thump
      osc('sine', f, t, d, out, v, .004, d); osc('sine', f * 1.0035, t, d * .8, out, v * .5, .004, d * .8);
      osc('triangle', f * 2, t, d * .3, out, v * .16, .003, d * .3, 2000); osc('sine', f * 3.01, t, d * .1, out, v * .05, .002, d * .1);
      noise(t, .035, out, v * .3, 'lowpass', 420, .7, .001); };
    const harp = (t, m, v = .06) => { osc('triangle', mf(m), t, .9, K.sfx, v, .002, .9, 3200); osc('sine', mf(m) * 2, t, .35, K.sfx, v * .3, .002, .35); };
    const SC = [0, 2, 4, 5, 7, 9, 11];
    const gliss = (t, base, n, step, up = 1, v = .05) => { for (let k = 0; k < n; k++) { const j = up ? k : n - 1 - k; harp(t + k * step, base + 12 * Math.floor(j / 7) + SC[j % 7], v); } };
    const strings = (t, dur, notes, v = .016) => { K.pad(t, dur, notes, v, 'sawtooth', 850); K.pad(t, dur, notes.map(m => m + .09), v * .8, 'sawtooth', 700); };
    const brushSn = (t, v = .05) => { noise(t, .17, K.music, v, 'bandpass', 3200, .7, .014); noise(t, .05, K.music, v * .45, 'highpass', 6500, .5, .002); };
    const ubass = (t, m, v = .2) => { osc('sine', mf(m), t, .5, K.music, v, .008); osc('triangle', mf(m), t, .25, K.music, v * .35, .01, .25, 600); };
    const tom = (t, f0 = 95, v = .7, d = .5) => { const o = osc('sine', f0, t, d, K.sfx, v, .003); o.frequency.exponentialRampToValueAtTime(f0 * .5, at(t + d * .9));
      const o2 = osc('triangle', f0 * 1.6, t, d * .5, K.sfx, v * .2, .003); o2.frequency.exponentialRampToValueAtTime(f0 * .7, at(t + d * .45)); noise(t, d * .6, K.sfx, v * .35, 'lowpass', 360, .7); };
    const sweep = (t, d, v, f0, f1) => { const f = noise(t, d, K.sfx, v, 'bandpass', f0, 1.2, d * .4); f.frequency.exponentialRampToValueAtTime(f1, at(t + d)); };
    return {
      groove(a, b, root, tri) {
        strings(a, b - a, tri.map(m => m - 12));
        for (let t = a, beat = 0; t < b - .01; t += .5, beat++) {
          if (beat % 2 === 0) { ubass(t, root); K.kick(t, .12); tri.forEach((m, j) => piano(t + j * .025, m - 12, .035, .9)); }
          else { ubass(t, root + 7, .13); brushSn(t, .05); }
          piano(t + .25, tri[(beat + 1) % 3], .03, .6);
          noise(t + .25, .09, K.music, .012, 'bandpass', 5000, .6, .02);
        }
      },
      motif(t) { [[0, 'E5'], [.25, 'G5'], [.5, 'C6'], [1.0, 'B5'], [1.25, 'G5'], [1.5, 'C6']].forEach(([d, n]) => piano(t + d, nm(n), .085, 1.3)); },
      ending(t, root, tri) {
        strings(t, 1.6, [48, 55, 60, 64, 67], .022);
        [36, 48, 55, 60, 64, 67, 72].forEach((m, j) => piano(t + j * .035, m, .06, 2.2));
        piano(t + .3, nm('E6'), .06, 1.8); piano(t + .55, nm('G6'), .05, 1.8); ubass(t, 36, .22);
      },
      cues: {
        reveal: t => { sweep(t, .7, .1, 700, 3200); piano(t, 48, .08, 1.6); },
        star: t => { gliss(t, 84, 6, .05, 0, .045); piano(t + .5, 84, .06, 1.2); },
        pop: t => { piano(t, 79, .09, .5); K.pop(t, .05); },
        jump: (t, n) => { gliss(t, 67 + n * 2, 4, .045, 1, .05); K.slide(t, 280, n ? 760 : 620, .38, .05, 'triangle'); },
        fall: (t, n) => K.slide(t, n ? 1300 : 1100, 260, .25, .045, 'sine'),
        splat: t => { noise(t, .22, K.sfx, .5, 'lowpass', 750, .8, .002); sweep(t, .2, .35, 2000, 320); const o = osc('sine', 150, t, .22, K.sfx, .4, .002); o.frequency.exponentialRampToValueAtTime(48, at(t + .2));
          const pl = osc('sine', 900, t + .2, .06, K.sfx, .05, .003); pl.frequency.exponentialRampToValueAtTime(1500, at(t + .25)); },
        dizzy: t => [91, 88, 91, 86].forEach((m, k) => piano(t + k * .13, m, .045, .4)),
        getup: t => { piano(t, 67, .06, .5); piano(t + .12, 72, .07, .7); },
        drop: t => sweep(t, .26, .1, 3000, 600),
        thud: (t, n) => { tom(t, 92 - n * 6, .75 + n * .08, .55); brushSn(t + .01, .06); },
        idea: t => [84, 88, 91, 96].forEach((m, k) => piano(t + k * .05, m, .06, 1.0)),
        hop: (t, n) => { harp(t, 72 + n * 4, .06); harp(t + .06, 76 + n * 4, .06); },
        land: t => tom(t, 130, .3, .22),
        leap: t => { gliss(t, 72, 8, .035, 1, .055); sweep(t, .45, .08, 500, 3500); },
        grab: t => { gliss(t, 84, 10, .025, 1, .06); tom(t, 80, .45, .6); [96, 100, 103].forEach((m, k) => osc('sine', mf(m), t + .05 + k * .05, 1.2, K.sfx, .025, .15, 1.2));
          noise(t, 1.2, K.sfx, .07, 'highpass', 5500, .5, .3); },
        title: t => { sweep(t, .4, .06, 900, 2600); piano(t + .05, 76, .05, 1.2); piano(t + .1, 79, .05, 1.2); },
      },
    };
  },
});
