// 06 · SKETCHBOOK PENCIL TEST
// Cream sketchbook page with tooth, spiral binding, smudges, a coffee ring and margin notes.
// Every drawing = graphite passes with pressure (width + alpha along the stroke) and overshoot,

function catmull(pts, closed, step) {

  for (let i = 0; i < 6; i++) { const a = -Math.PI * .95 + i * .38; pencil(g, [M([Math.cos(a) * 88, Math.sin(a) * 88]), M([Math.cos(a) * 126, Math.sin(a) * 126])], { w: 3.2, a: .9, seed: 550 + i, passes: 1, over: 4 }); }
}
const SPARK = (() => { const r = rng(88), a = []; for (let i = 0; i < 18; i++) { const an = -Math.PI / 2 + (r() - .5) * 3.6, sp = 380 + r() * 700; a.push({ vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, spin: (r() - .5) * 8, s: 12 + r() * 14, y: i % 3 !== 2 }); } return a; })();
function sparkles(g, t) {
  const d = t - LEAP.t1; if (d < 0 || d > 1.9) return;
  const { x: x0, y: y0 } = starState(LEAP.t1);
  SPARK.forEach((p, i) => { const px = x0 + p.vx * d * Math.exp(-d * 1.1), py = y0 + p.vy * d * Math.exp(-d * 1.1) + 420 * d * d, a = p.spin * d, s = p.s * (1 - d / 2.2);
    if (py > GY) return;
    const col = p.y ? P.yelD : P.gr, o = { w: p.y ? 4 : 2.6, a: .95, col, passes: 1, over: 2, seed: 600 + i };
    pencil(g, [[px + Math.cos(a) * s, py + Math.sin(a) * s], [px - Math.cos(a) * s, py - Math.sin(a) * s]], o);
    pencil(g, [[px - Math.sin(a) * s, py + Math.cos(a) * s], [px + Math.sin(a) * s, py - Math.cos(a) * s]], { ...o, seed: 640 + i }); });
}

// ---------- title: OHRonShemer to a mask, filled with graphite streaks ----------
function buildTitle() {
  const probe = mkCanvas(10, 10).getContext('2d'); let size = 176; probe.font = `${size}px OHRonShemer`;
  const w0 = probe.measureText(TITLE.text).width; if (w0 > 900) size = Math.floor(size * 900 / w0);
  probe.font = `${size}px OHRonShemer`; const tw = probe.measureText(TITLE.text).width;
  const bw = tw + 80, bh = size * 1.7, c = mkCanvas(Math.ceil(bw * S), Math.ceil(bh * S)), g = c.getContext('2d'); g.setTransform(S, 0, 0, S, 0, 0);
  g.font = `${size}px OHRonShemer`; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = P.grd; g.fillText(TITLE.text, bw / 2, bh / 2);
  const r = rng(700); g.lineCap = 'round';
  g.globalCompositeOperation = 'destination-out';          // pencil striations inside the letters
  for (let i = 0; i < 420; i++) { const x = r() * bw, y = r() * bh, l = 14 + r() * 40; g.globalAlpha = .12 + r() * .22; g.lineWidth = 1 + r() * 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * .55, y - l); g.stroke(); }
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 260; i++) { const x = r() * bw, y = r() * bh, l = 12 + r() * 36; g.globalAlpha = .2 + r() * .3; g.strokeStyle = '#111'; g.lineWidth = 1 + r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * .55, y - l); g.stroke(); }
  TITLE_CV = c; TITLE_M = { bw, bh, tw, size };
}
function drawTitle(g, t) {
  if (t < TITLE.t0) return;
  const { bw, bh, tw, size } = TITLE_M, x0 = W / 2 - bw / 2, y0 = TITLE.y - bh / 2, k = prog(t, TITLE.t0, TITLE.t0 + .5), r = rng(710 + BF);
  // the artist rubs a clear patch first (string / halo stay readable behind)
  g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = .82 * clamp(k * 3); g.fillStyle = '#000'; g.beginPath(); g.roundRect(W / 2 - tw / 2 - 30, TITLE.y - size * .62, tw + 60, size * 1.24, 60); g.fill(); g.restore();
  g.save(); g.beginPath(); const rx = W / 2 + tw / 2 + 20, span = tw + 50; g.rect(rx - span * k, y0, span * k + 10, bh); g.clip();
  g.globalAlpha = .55; g.drawImage(TITLE_CV, x0 + 1.5 + (r() - .5) * 1.5, y0 + 2.5 + (r() - .5) * 1.5, bw, bh);   // darker pass underneath
  g.globalAlpha = 1; g.drawImage(TITLE_CV, x0 + (r() - .5) * 1.2, y0 + (r() - .5) * 1.2, bw, bh);
  g.restore();
  const ku = prog(t, TITLE.t0 + .48, TITLE.t0 + .68);
  if (ku > 0) { const uy = TITLE.y + size * .52;
    pencil(g, [[W / 2 + tw / 2 + 10, uy - 6], [W / 2, uy + 6], [W / 2 - tw / 2 - 10, uy - 4]], { w: 5.5, a: .95, seed: 720, passes: 2, k: ku, over: 16 });
    const k2 = prog(t, TITLE.t0 + .7, TITLE.t0 + .82);
    if (k2 > 0) pencil(g, [[W / 2 + tw * .3, uy + 22], [W / 2 - tw * .28, uy + 26]], { w: 3, a: .7, seed: 721, passes: 1, k: k2, over: 10 }); }
}

// ============================================================
film({
  kit: { reverb: .3, musicGain: .6, sfxGain: .85, revSec: 2.2 },
  setup() {
    TOOTH = makeTooth();
    G = mkCanvas(OUT_W, OUT_H); GX = G.getContext('2d');
    TOOTHP = GX.createPattern(TOOTH, 'repeat');
    buildPaper(); buildTitle();
  },
  draw(c, tf) {
    const t = Math.floor(tf * 12) / 12;       // pencil test on twos
    BF = Math.floor(tf * 12);
    const z = zoom(t), sh = shake(tf);
    const cam = g => { g.setTransform(S, 0, 0, S, 0, 0); g.translate(540 + sh * .6, 760 + sh); g.scale(z, z); g.translate(-540, -760); };
    c.fillStyle = P.desk; c.fillRect(0, 0, W, H);
    c.save(); cam(c); c.drawImage(L_PAPER, -40, -40, W + 80, H + 80); c.restore();
    GX.setTransform(1, 0, 0, 1, 0, 0); GX.clearRect(0, 0, OUT_W, OUT_H); cam(GX);
    const g = GX;
    drawStar(g, t);
    drawBlock(g, 0, t); drawBlock(g, 1, t);
    puffs(g, TOWER.x, GY, t, BLOCKS[0].land, 800); puffs(g, TOWER.x, blockTop(0), t, BLOCKS[1].land, 820);
    SPLATS.forEach((te, n) => { puffs(g, HX, GY, t, te, 840 + n * 20); impact(g, HX, GY - 40, t, te, 880 + n * 20); });
    const s = pose(t); s._t = t;
    if (t < .6) s.sc = t < .3 ? 1 : 1 + .1 * Math.sin(prog(t, .3, .6) * Math.PI);
    groundShadow(g, s);
    const sp = pose(Math.max(0, t - 1 / 12));
    if (Math.hypot(sp.x - s.x, sp.y - s.y) > 24) pitz(g, { ...sp, sc: 1 }, t, { ghost: true });
    speed(g, s);
    const intro = t < .6 ? { con: clamp((t + .35) / .45), out: clamp((t + .5) / .6), limb: prog(t, -.2, .25), face: t >= .1 ? 1 : .9 } : null;
    pitz(g, s, t, { intro });
    dizzyStars(g, s.x, s.y - 250 * s.sy * s.sc, t, s.dizzy);
    bang(g, s, t);
    sparkles(g, t);
    drawTitle(g, t);
    // drawing number in the corner box
    g.save(); g.font = '700 40px Heebo'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = P.grd; g.globalAlpha = .85; g.fillText(String(BF + 1), 981, 1850); g.restore();
    toothPass(g);
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply'; c.drawImage(G, 0, 0); c.restore();
  },
  voice: K => {
    const R = rng(4242);
    // felt piano: sine partials, gentle hammer thump, a slightly detuned unison
    const pia = (t, m, v = .06, d = 1.4, out = K.music) => { const f = K.mf(m);
      K.osc('sine', f, t, d, out, v, .004, d); K.osc('sine', f * 1.0015, t, d, out, v * .45, .006, d * .9);
      K.osc('sine', f * 2, t, d * .45, out, v * .28, .003, d * .4); K.osc('triangle', f * 3, t, d * .15, out, v * .07, .002, d * .12, 2600);
      K.noise(t, .03, out, v * .35, 'lowpass', 900 + m * 12, .7, .001); };
    const scratch = (t, d = .14, v = .05, f0 = 2600, f1 = 3600) => { const n = Math.max(3, Math.round(d / .018));
      for (let k = 0; k < n; k++) { const tt = t + k * d / n, f = f0 * Math.pow(f1 / f0, k / n) * (.85 + R() * .3); K.noise(tt, d / n * .9, K.sfx, v * (.5 + R() * .6), 'bandpass', f, 3.5, .002); } };
    const rub = (t, n = 5, v = .12) => { for (let k = 0; k < n; k++) { K.noise(t + k * .065, .055, K.sfx, v * (k % 2 ? .7 : 1), 'bandpass', 520 + (k % 2) * 220, 1.1, .015); K.noise(t + k * .065, .05, K.sfx, v * .25, 'highpass', 3000, .7, .01); } };
    const thump = (t, v = .5) => { const o = K.osc('sine', 96, t, .32, K.sfx, v, .003); o.frequency.exponentialRampToValueAtTime(40, K.at(t + .28)); K.noise(t, .22, K.sfx, v * .45, 'lowpass', 300, .7); K.noise(t, .05, K.sfx, v * .25, 'bandpass', 1200, 1.2); };
    const flip = (t, v = .14) => { const f = K.noise(t, .38, K.sfx, v, 'bandpass', 500, 1.2, .14); f.frequency.exponentialRampToValueAtTime(4800, K.at(t + .38));
      for (let k = 0; k < 6; k++) K.noise(t + .05 + k * .035, .025, K.sfx, v * .35, 'highpass', 2600, .8); thump(t + .36, v * .5); };
    return {
      groove(a, b, root, tri) {
        for (let t = a, k = 0; t < b - .01; t += .25, k++) {
          if (k % 2 === 0) pia(t, (k % 4 === 0 ? root : root + 7), .07, 1.0);
          else pia(t, tri[((k - 1) >> 1) % 3], .038, .8);
        }
      },
      motif(t) { [[0, 'E5'], [.25, 'G5'], [.5, 'C6'], [1.0, 'B5'], [1.25, 'G5'], [1.5, 'C6']].forEach(([d, n]) => pia(t + d, K.nm(n), .075, 1.4)); },
      ending(t) { [36, 48, 55, 60, 64, 67, 72].forEach((m, j) => pia(t + j * .035, m, .055, 2.4)); pia(t + .4, 96, .035, 1.6); pia(t + .9, 91, .025, 1.4); },
      cues: {
        reveal: t => flip(t, .16),
        star: t => { scratch(t, .3, .035, 3000, 2200); pia(t + .45, 96, .04, 1.2, K.sfx); },
        pop: t => { K.noise(t, .02, K.sfx, .12, 'bandpass', 3200, 2); pia(t, 79, .04, .5, K.sfx); },
        jump: (t, n) => { scratch(t, .12, .06, 2200, 4200); pia(t, 72 + n * 2, .035, .4, K.sfx); pia(t + .06, 79 + n * 2, .035, .5, K.sfx); },
        fall: (t, n) => { rub(t, 3, .09); [88, 84, 81, 77, 74].forEach((m, j) => pia(t + j * .04, m - n * 2, .03, .35, K.sfx)); },
        splat: t => { [36, 37, 38].forEach(m => pia(t, m, .05, .6, K.sfx)); thump(t, .45); rub(t + .12, 4, .1); },
        dizzy: t => { [96, 95, 96, 95, 96].forEach((m, j) => pia(t + j * .08, m, .02, .3, K.sfx)); },
        getup: t => { scratch(t, .1, .05, 2000, 3400); pia(t, 67, .04, .4, K.sfx); pia(t + .08, 72, .04, .5, K.sfx); },
        drop: t => scratch(t, .25, .05, 3800, 1800),
        thud: (t, n) => thump(t, .6 + n * .1),
        idea: t => [84, 88, 91, 96].forEach((m, j) => pia(t + j * .05, m, .045, .9, K.sfx)),
        hop: (t, n) => { scratch(t, .09, .05, 2400, 4000); pia(t, 76 + n * 3, .04, .4, K.sfx); },
        land: t => { K.noise(t, .05, K.sfx, .12, 'lowpass', 500); pia(t, 55, .03, .25, K.sfx); },
        leap: t => scratch(t, .42, .06, 1800, 5200),
        grab: t => { [72, 74, 76, 77, 79, 81, 83, 84, 86, 88, 91, 96].forEach((m, j) => pia(t + j * .03, m, .042, .9, K.sfx)); thump(t, .3); K.noise(t, 1.2, K.sfx, .05, 'highpass', 6000, .5, .01); },
        title: t => { flip(t, .12); for (let k = 0; k < 6; k++) scratch(t + .06 + k * .08, .06, .035, 2600 + k * 150, 3400); scratch(t + .5, .2, .045, 2200, 3800); },
      },
    };
  },
});
