<script>
'use strict';
// ============================================================
// 04 · RISOGRAPH PRINT
// Three fluorescent inks, each rendered as its own PLATE (an offscreen canvas holding only
// that ink's coverage). Plates carry solids, knock-outs and coarse halftone screens at their
// own screen angle; each plate is then eaten by a grain mask (blotchy density, drum streaks,
// speckle dropout), tinted with its ink and multiplied onto warm paper, misregistered by a
// few px + a tiny rotation that jitters on twos. Overprints make the extra colours:
// pink+blue = navy/purple, yellow+blue = green, yellow+pink = orange-red.
// Voice: lo-fi hip-hop (dusty Rhodes with wow/flutter, half-time boom-bap, vinyl crackle).
// ============================================================
const INK = { Y: '#ffe800', P: '#ff48b0', B: '#0078bf' };
const KEYS = ['Y', 'P', 'B'];
const ANG = { Y: 5, P: 75, B: 20 };            // halftone screen angles (deg), world-anchored
const CELL = 13;                                // halftone cell (world px)
const MARGIN = 40;                              // unprinted paper margin (riso can't print to the edge)
const PAPER_C = '#f4eddd';
let G = {}, PLATE = {}, STATIC = {}, MASK = {}, PAPER = null, WM = new DOMMatrix(), MPAD = 96;

// ---------- geometry (cached) ----------
const _cache = new Map();
const memo = (k, f) => { if (!_cache.has(k)) _cache.set(k, f()); return _cache.get(k); };
function blob(rx, ry, seed, n = 34, amp = .06) {
  return memo(`b${rx}|${ry}|${seed}|${n}|${amp}`, () => {
    const r = rng(seed), ph = [r() * TAU, r() * TAU, r() * TAU], pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * TAU, m = 1 + amp * (Math.sin(a * 2 + ph[0]) * .5 + Math.sin(a * 3 + ph[1]) * .35 + Math.sin(a * 5 + ph[2]) * .15);
      pts.push([Math.cos(a) * rx * m, Math.sin(a) * ry * m]); }
    return pts;
  });
}
function bumpy(rx, ry, bumps, seed) {
  return memo(`c${rx}|${ry}|${bumps}|${seed}`, () => {
    const r = rng(seed), pts = [], n = 90;
    for (let i = 0; i < n; i++) { const a = i / n * TAU; let m = 1; if (Math.sin(a) < .3) m += .18 * Math.abs(Math.sin(a * bumps / 2 + r() * .05)); pts.push([Math.cos(a) * rx * m, Math.sin(a) * ry * m * (Math.sin(a) > 0 ? .55 : 1)]); }
    return pts;
  });
}
function starPts(R, r) { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, rr = i % 2 ? r : R; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }
function burstPts(R, r, n, seed) { const q = rng(seed), pts = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU, rr = (i % 2 ? r : R) * (1 + (q() - .5) * .25); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }
function pathOf(pts, smooth) {
  const p = new Path2D(), n = pts.length;
  if (!smooth) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s0 = m(pts[n - 1], pts[0]);
  p.moveTo(s0[0], s0[1]);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; p.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  p.closePath(); return p;
}
function linePath(pts) {
  const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  const L = pts[pts.length - 1]; p.lineTo(L[0], L[1]); return p;
}
const offs = (pts, dx, dy) => pts.map(p => [p[0] + dx, p[1] + dy]);
const ell = (x, y, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, TAU); return p; };
const rrect = (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };

// ---------- plate primitives (every plate draws coverage in black; ink is applied at the end) ----------
const TILE = new Map();
function tile(v) {
  v = Math.round(clamp(v, 0, .95) * 20) / 20;
  if (!TILE.has(v)) { const c = mkCanvas(CELL, CELL), q = c.getContext('2d'); q.fillStyle = '#000'; q.beginPath(); q.arc(CELL / 2, CELL / 2, CELL * Math.sqrt(v / Math.PI), 0, TAU); q.fill(); TILE.set(v, c); }
  return TILE.get(v);
}
// halftone screen anchored to the page (world), not to the object: dots stay put while shapes move through them
function tint(g, v, k) { const p = g.createPattern(tile(v), 'repeat'); p.setTransform(g.getTransform().inverse().multiply(WM).rotate(ANG[k])); return p; }
const fillIn = (g, path, rule = 'nonzero') => { g.fillStyle = '#000'; g.fill(path, rule); };
const knock = (g, path, rule = 'nonzero') => { g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(path, rule); g.restore(); };
const tintIn = (g, k, path, v, rule = 'nonzero') => { if (v < .03) return; g.fillStyle = tint(g, v, k); g.fill(path, rule); };
const strokeIn = (g, path, lw) => { g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#000'; g.stroke(path); };
const knockStroke = (g, path, lw) => { g.save(); g.globalCompositeOperation = 'destination-out'; strokeIn(g, path, lw); g.restore(); };
function each(f) { for (const k of KEYS) f(G[k], k); }
function push(x, y, rot = 0, sx = 1, sy = 1) { each(g => { g.save(); g.translate(x, y); if (rot) g.rotate(rot); if (sx !== 1 || sy !== 1) g.scale(sx, sy); }); }
function pop() { each(g => g.restore()); }
// an opaque object printed in the given inks: knock it out of every other plate (no unwanted overprint)
function obj(path, inks, rule) { each((g, k) => inks.includes(k) ? fillIn(g, path, rule) : knock(g, path, rule)); }
// navy line = pink + blue overprint
function navy(path, lw, knockY = true) { strokeIn(G.P, path, lw); strokeIn(G.B, path, lw); if (knockY) knockStroke(G.Y, path, lw); }
// variable-density halftone field on the plate's rotated screen: fn(x,y) -> coverage 0..1
function htField(g, k, x0, y0, x1, y1, fn, cell = CELL) {
  const a = ANG[k] * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
  const cs = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]];
  const pi = cs.map(([x, y]) => (x * ux + y * uy) / cell), pj = cs.map(([x, y]) => (-x * uy + y * ux) / cell);
  const i0 = Math.floor(Math.min(...pi)) - 1, i1 = Math.ceil(Math.max(...pi)) + 1, j0 = Math.floor(Math.min(...pj)) - 1, j1 = Math.ceil(Math.max(...pj)) + 1;
  g.beginPath(); g.fillStyle = '#000';
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const u = (i + .5) * cell, v = (j + .5) * cell, x = u * ux - v * uy, y = u * uy + v * ux;
    if (x < x0 || x > x1 || y < y0 || y > y1) continue;
    const val = fn(x, y); if (val < .02) continue;
    const r = Math.min(cell * .72, cell * Math.sqrt(val / Math.PI)); g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU);
  }
  g.fill();
}
function textIn(g, str, x, y, font, mode = 'fill', lw = 0) {
  g.save(); g.font = font; g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.strokeStyle = '#000';
  if (mode === 'knock') g.globalCompositeOperation = 'destination-out';
  if (lw) { g.lineWidth = lw; g.lineJoin = 'round'; g.strokeText(str, x, y); }
  g.fillText(str, x, y); g.restore();
}

// ---------- paper + ink grain masks (made once) ----------
function buildPaper() {
  PAPER = mkCanvas(OUT_W, OUT_H); const g = PAPER.getContext('2d'), r = rng(5);
  g.fillStyle = PAPER_C; g.fillRect(0, 0, OUT_W, OUT_H);
  const id = g.getImageData(0, 0, OUT_W, OUT_H), d = id.data;
  for (let k = 0; k < d.length; k += 4) { const n = (r() - .5) * 9; d[k] += n; d[k + 1] += n; d[k + 2] += n * 1.1; }
  g.putImageData(id, 0, 0);
  g.setTransform(S, 0, 0, S, 0, 0);
  for (let i = 0; i < 900; i++) { g.strokeStyle = `rgba(${120 + r() * 40},${100 + r() * 30},70,${.05 + r() * .09})`; g.lineWidth = .6 + r(); const x = r() * W, y = r() * H, a = r() * TAU, l = 4 + r() * 16;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .5) * l * .5, y + Math.sin(a + .5) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(70,55,40,${.1 + r() * .25})`; g.beginPath(); g.arc(r() * W, r() * H, .5 + r() * 1.3, 0, TAU); g.fill(); }
  const vg = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); vg.addColorStop(0, 'rgba(120,90,50,0)'); vg.addColorStop(1, 'rgba(120,90,50,.10)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}
// alpha = how much ink is REMOVED: blotchy density, drum streaks, fine grain and speckle dropout
function buildMask(seed, strength) {
  const w = OUT_W + MPAD, h = OUT_H + MPAD, c = mkCanvas(w, h), g = c.getContext('2d'), id = g.createImageData(w, h), d = id.data, r = rng(seed);
  const lat = cell => { const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, a = new Float32Array(gw * gh); for (let k = 0; k < a.length; k++) a[k] = r(); return { cell, gw, a }; };
  const smp = (L, x, y) => { const fx = x / L.cell, fy = y / L.cell, ix = fx | 0, iy = fy | 0, u = fx - ix, v = fy - iy, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v), a = L.a, gw = L.gw, o = iy * gw + ix;
    return (a[o] * (1 - su) + a[o + 1] * su) * (1 - sv) + (a[o + gw] * (1 - su) + a[o + gw + 1] * su) * sv; };
  const L1 = lat(190 * S), L2 = lat(46 * S), L3 = lat(Math.max(2, 3.2 * S));
  const rows = new Float32Array(h), rl = lat(26 * S); for (let y = 0; y < h; y++) rows[y] = smp(rl, 3, y);
  for (let y = 0; y < h; y++) {
    const streak = Math.max(0, rows[y] - .62) * .55;
    for (let x = 0; x < w; x++) {
      const k = (y * w + x) * 4;
      let rem = Math.max(0, smp(L1, x, y) * .65 + smp(L2, x, y) * .35 - .5) * 1.1 + streak;
      rem += Math.max(0, smp(L3, x, y) - .55) * .9;
      if (r() < .05) rem += .3 + r() * .7;
      d[k + 3] = clamp(rem * strength) * 255;
    }
  }
  g.putImageData(id, 0, 0); return c;
}

// ---------- static print layers (per plate, world coords) ----------
function groundPath() {
  const p = new Path2D(); p.moveTo(0, H);
  for (let x = 0; x <= W; x += 18) p.lineTo(x, GY - 16 - 7 * Math.sin(x * .013 + 1) - (Math.floor(x / 18) % 2 ? 9 : 0));
  p.lineTo(W, H); p.closePath(); return p;
}
const CLOUDS = [[205, 1040, 1.0, 830], [900, 1250, .8, 831], [150, 470, .7, 832], [930, 760, .55, 833]];
const SPARKS = [[120, 300, 16], [980, 470, 22], [300, 820, 12], [720, 980, 14], [960, 1080, 10], [110, 1260, 13], [650, 1330, 11]];
function sparkPath(x, y, s) { const p = new Path2D(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU - Math.PI / 2, rr = i % 2 ? s * .28 : s; i ? p.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : p.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } p.closePath(); return p; }
function buildStatic() {
  WM = new DOMMatrix([S, 0, 0, S, 0, 0]);
  const gp = groundPath();
  const hills = new Path2D(); hills.moveTo(0, GY); hills.quadraticCurveTo(250, 1250, 600, GY); hills.closePath();
  hills.moveTo(420, GY); hills.quadraticCurveTo(820, 1180, W, 1420); hills.lineTo(W, GY); hills.closePath();
  STATIC.B = layer(g => {
    htField(g, 'B', 0, 0, W, GY, (x, y) => .07 + .30 * Math.pow(clamp((y - 120) / (GY - 120)), 1.3));
    CLOUDS.forEach(([x, y, s, sd]) => { g.save(); g.translate(x, y); g.scale(s, s); knock(g, pathOf(bumpy(150, 62, 6, sd), true)); g.restore(); });
    SPARKS.forEach(([x, y, s]) => knock(g, sparkPath(x, y, s * 1.5)));
    knock(g, gp); tintIn(g, 'B', gp, .34);
    for (let i = 0; i < 4; i++) { const y0 = GY + 70 + i * 82 + i * i * 8, p = new Path2D(); p.moveTo(0, y0); for (let x = 0; x <= W; x += 30) p.lineTo(x, y0 + 8 * Math.sin(x * .01 + i * 2)); strokeIn(g, p, 7 + i * 2); }
    const r = rng(77); for (let x = 70; x < W - 40; x += 70 + r() * 60) { const y = GY - 8 + r() * 6, h = 16 + r() * 10;   // little grass tufts
      for (const dx of [-1, 0, 1]) { const p = new Path2D(); p.moveTo(x + dx * 5, y + 8); p.quadraticCurveTo(x + dx * 6, y - h * .5, x + dx * 14, y - h * (dx ? .8 : 1)); strokeIn(g, p, 4.5); } }
  });
  STATIC.P = layer(g => {
    tintIn(g, 'P', hills, .26); knock(g, gp);
    tintIn(g, 'P', ell(540, 600, 270, 270), .16);
    const r = rng(90); for (let i = 0; i < 14; i++) { const x = 70 + r() * 940, y = GY + 60 + r() * 250; for (let p = 0; p < 5; p++) { const a = p / 5 * TAU; fillIn(g, ell(x + Math.cos(a) * 11, y + Math.sin(a) * 11, 9, 9)); } knock(g, ell(x, y, 6, 6)); }
  });
  STATIC.Y = layer(g => {
    fillIn(g, gp);
    SPARKS.forEach(([x, y, s]) => fillIn(g, sparkPath(x, y, s)));
    CLOUDS.forEach(([x, y, s, sd]) => { g.save(); g.translate(x, y); g.scale(s, s); g.save(); g.clip(pathOf(bumpy(150, 62, 6, sd), true)); tintIn(g, 'Y', rrect(-200, 8, 400, 100, 0), .3); g.restore(); g.restore(); });
  });
}

// ---------- the star ----------
function starS(t) {
  const st = starState(t);
  if (t < .6) { const L = SLEN * lerp(.55, 1, eBack(prog(t, 0, .55))), a = starAng(t); return { ...st, visible: true, x: PIV[0] + L * Math.sin(a), y: PIV[1] + L * Math.cos(a) }; }
  return st;
}
function drawStar(t) {
  const st = starS(t), { x, y, ang: a, lit } = st;
  strokeIn(G.B, linePath([PIV, [lerp(PIV[0], x, .5) + 5 * Math.sin(t * 2), lerp(PIV[1], y, .5)], [x - 90 * Math.sin(a), y - 90 * Math.cos(a)]]), 5);
  if (lit > 0) {                                                  // pink overprint glow + rays
    const R = 380 * lit, d = t - LEAP.t1;
    htField(G.P, 'P', x - R, y - R, x + R, y + R, (px, py) => { const q = Math.hypot(px - x, py - y) / R; return q < 1 ? .62 * lit * Math.pow(1 - q, 1.2) : 0; });
    push(x, y, t * .35);
    for (let i = 0; i < 14; i++) { const ra = i / 14 * TAU, r0 = 150, r1 = r0 + (110 + 70 * (i % 2)) * lit * (1 + .15 * Math.sin(d * 9 + i)), w = .1;
      const p = new Path2D(); p.moveTo(Math.cos(ra - w) * r0, Math.sin(ra - w) * r0); p.lineTo(Math.cos(ra) * r1, Math.sin(ra) * r1); p.lineTo(Math.cos(ra + w) * r0, Math.sin(ra + w) * r0); p.closePath();
      if (i % 2) obj(p, ['Y']); else obj(p, ['Y', 'P']); }
    pop();
  }
  const pulse = 1 + .04 * Math.sin(t * 5) + .16 * lit * Math.exp(-(t - LEAP.t1) * 3);
  push(x, y, -a, pulse, pulse);
  const sp = pathOf(starPts(STAR_R, STAR_R * .5), false);
  obj(sp, ['Y']); strokeIn(G.Y, sp, 18);                           // round the points a touch
  G.P.save(); G.P.clip(sp); tintIn(G.P, 'P', rrect(-130, 18, 260, 120, 0), lit > 0 ? .15 : .34); G.P.restore();
  fillIn(G.P, ell(-32, 16, 13, 8)); fillIn(G.P, ell(32, 16, 13, 8));
  const dk = p => { fillIn(G.P, p); fillIn(G.B, p); };
  if (lit > 0) {
    dk(ell(-20, -6, 8, 9)); dk(ell(20, -6, 8, 9)); each(g => knock(g, ell(-17, -9, 3, 3))); each(g => knock(g, ell(23, -9, 3, 3)));
    const m = new Path2D(); m.moveTo(-14, 8); m.quadraticCurveTo(0, 34, 14, 8); m.closePath(); dk(m);
  } else if (st.dodge) {
    dk(ell(-12, -6, 6.5, 7)); dk(ell(26, -6, 6.5, 7)); navy(linePath([[-4, 16], [12, 11]]), 4, false);
  } else {
    navy(linePath([[-29, -4], [-20, 3], [-11, -4]]), 4.5, false); navy(linePath([[11, -4], [20, 3], [29, -4]]), 4.5, false); navy(linePath([[-8, 14], [0, 20], [8, 14]]), 4, false);
  }
  pop();
}

// ---------- the failure blocks ----------
function drawBlock(i, t) {
  const b = blockState(i, t); if (!b.visible) return;
  if (i === 0) { const k = clamp(1 - (GY - b.bottom) / 900); if (k > 0) tintIn(G.B, 'B', ell(b.x, GY + 6, 150 * k, 20 * k), .6); }
  push(b.x, b.bottom, b.rot, 1 + b.sq * .6, 1 - b.sq); push(0, -b.h / 2);
  const body = rrect(-b.w / 2, -b.h / 2, b.w, b.h, 14);
  obj(body, ['B']);
  G.P.save(); G.P.clip(body); tintIn(G.P, 'P', rrect(b.w / 2 - 56, -b.h / 2, 60, b.h, 0), .5); tintIn(G.P, 'P', rrect(-b.w / 2, b.h / 2 - 30, b.w, 30, 0), .5); G.P.restore();
  each(g => textIn(g, b.label, 0, -52, '800 76px Heebo', 'knock'));
  const disc = ell(0, 50, 52, 52);
  obj(disc, ['P']);
  each(g => textIn(g, b.n, 0, 56, '900 78px Heebo', 'knock'));
  pop(); pop();
}

// ---------- פיצי ----------
function pitz(s, t) {
  const { x, y, sx = 1, sy = 1, rot = 0, sc = 1, eyes = 'norm', mouth = 'smile', brow = null, look = [0, 0], armL = .35, armR = .35, band = 0, jig = 0, legs = 0 } = s;
  if (sc <= .01) return;
  push(x, y, rot, sx * sc, sy * sc);
  // arms (navy lines behind the body) + pink hands
  [[-1, armL], [1, armR]].forEach(([sd, a]) => {
    const sh = [sd * 72, -118], hd = [sh[0] + sd * Math.sin(a) * 96, sh[1] + Math.cos(a) * 96], el = [lerp(sh[0], hd[0], .5) + sd * 8, lerp(sh[1], hd[1], .5) + 6];
    navy(linePath([sh, el, hd]), 11);
    const h = ell(hd[0], hd[1], 17, 16); obj(h, ['P']); strokeIn(G.B, h, 4);
  });
  // legs + blue feet
  [[-1, 0], [1, 1]].forEach(([sd, n]) => {
    const sw = legs ? Math.sin(legs + n * Math.PI) * 18 : 0, hip = [sd * 34, -34], ft = [sd * 42 + sw, -2 + Math.abs(sw) * .2];
    navy(linePath([hip, [lerp(hip[0], ft[0], .5) + sd * 4, -18], ft]), 11);
    obj(ell(ft[0] + sd * 8, ft[1] - 4, 27, 14), ['B']);
  });
  // body: solid pink, blue halftone shading crescent, one-plate blue outline
  const bp = pathOf(offs(blob(102, 94, 7, 40, .07), 0, -128), true);
  obj(bp, ['P']);
  const cres = new Path2D(); cres.rect(-150, -260, 300, 280); cres.ellipse(-26, -150, 104, 96, 0, 0, TAU);
  G.B.save(); G.B.clip(bp); tintIn(G.B, 'B', cres, .42, 'evenodd'); G.B.restore();
  strokeIn(G.B, bp, 7);
  if (band > 0) { push(-40, -210, -.45, eBack(band), eBack(band)); const bb = rrect(-46, -15, 92, 30, 12); obj(bb, ['Y']); tintIn(G.P, 'P', bb, .3); fillIn(G.P, rrect(-14, -11, 28, 22, 4)); strokeIn(G.B, bb, 3.5); pop(); }
  // cheeks: yellow over pink = warm orange-red blush
  fillIn(G.Y, ell(-66, -106, 18, 10)); fillIn(G.Y, ell(66, -106, 18, 10));
  // eyes
  const jx = Math.sin(t * 37) * jig * 7, jy = Math.cos(t * 29) * jig * 6;
  [-1, 1].forEach(sd => {
    const ex = sd * 38, ey = -152;
    if (eyes === 'x') { navy(linePath([[ex - 14, ey - 14], [ex + 14, ey + 14]]), 7); navy(linePath([[ex + 14, ey - 14], [ex - 14, ey + 14]]), 7); return; }
    if (eyes === 'happy') { navy(linePath([[ex - 18, ey + 6], [ex, ey - 12], [ex + 18, ey + 6]]), 7.5); return; }
    const R = eyes === 'big' || eyes === 'spark' ? 34 : 30;

const INKSETS = [['Y'], ['P'], ['B'], ['Y', 'P'], ['P', 'B'], ['Y', 'B']];
