// ---------- characters + props ----------
const AIR = new Set(['rise', 'apex', 'fall', 'hop', 'leap', 'hang']);

}

function drawStar(t, fi) {

const CONF = (() => { const r = rng(77), a = []; for (let i = 0; i < 60; i++) { const an = -Math.PI / 2 + (r() - .5) * 3.4, sp = 80 + r() * 150;

film({

  // ---------------- chiptune voice ----------------
