<script>
'use strict';
// ============================================================
// 02 · EDITORIAL ZINE COLLAGE
// Newsprint page, scissor-cut straight-edged pieces, coarse B/W halftone "photo" shading,
// one loud red + fluorescent yellow, hard offset shadows, googly eyes, ransom-note title.
// Stop-motion on THREES (8 drawings/s) with per-drawing paper jitter; camera shake on ones.
// Voice: lo-fi zine punk (detuned toy piano, square bass, cardboard drums, tape hiss,
// scissor snips, paper rustle, typewriter clacks + bell, kazoo slides).
// ============================================================
const C = {
  paper: '#e8e2d2', paperL: '#f1ede2', ink: '#161412', red: '#e63024', redD: '#a91c13',
  yel: '#f5e82c', white: '#fbfaf4', grey: '#8b857a', table: '#2a2622',
};
const PM = 48;                  // page margin so camera shake never shows an edge
let DRAW = 0;                   // stop-motion drawing index (8 per second)

// ---------- geometry ----------
const _cache = new Map();
const memo = (k, f) => { if (!_cache.has(k)) _cache.set(k, f()); return _cache.get(k); };
function poly(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, y] of pts) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return [a, b, c, d]; }
const offs = (pts, dx, dy) => pts.map(p => [p[0] + dx, p[1] + dy]);
// scissor-cut round shape: a handful of straight cuts around an ellipse
function cutPoly(rx, ry, n, seed, jit = .05) {
  return memo(`p${rx}|${ry}|${n}|${seed}|${jit}`, () => {
    const r = rng(seed), pts = [];
    for (let i = 0; i < n; i++) { const a = (i + (r() - .5) * .55) / n * TAU, m = 1 + (r() - .5) * 2 * jit; pts.push([Math.cos(a) * rx * m, Math.sin(a) * ry * m]); }
    return pts;
  });
}
// scissor-cut rectangle: corners off by a few px, sometimes a second cut angle on an edge
function cutRect(w, h, seed, amt = 6) {
  return memo(`r${w}|${h}|${seed}|${amt}`, () => {
    const r = rng(seed), j = () => (r() - .5) * 2 * amt, pts = [];
    const cs = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
    for (let i = 0; i < 4; i++) {
      pts.push([cs[i][0] + j(), cs[i][1] + j()]);
      if (r() < .45) { const nx = cs[(i + 1) % 4], u = .3 + r() * .4; pts.push([lerp(cs[i][0], nx[0], u) + j() * .6, lerp(cs[i][1], nx[1], u) + j() * .6]); }
    }
    return pts;
  });
}
function starPts(R, r, seed) {
  return memo(`s${R}|${r}|${seed}`, () => { const q = rng(seed), pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU + (q() - .5) * .05, rr = (i % 2 ? r : R) * (1 + (q() - .5) * .1); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; });
}
function burstPts(R, r, n, seed) {
  return memo(`u${R}|${r}|${n}|${seed}`, () => { const q = rng(seed), pts = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU + (q() - .5) * .08, rr = (i % 2 ? r : R) * (1 + (q() - .5) * .18); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; });
}

// ---------- textures ----------
let GRAINP = null;
const GRAIN = (() => {
  const c = mkCanvas(320, 320), g = c.getContext('2d'), r = rng(42);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 320, 320);
  for (let i = 0; i < 4200; i++) { const v = 150 + r() * 80 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 18},${.08 + r() * .14})`; g.fillRect(r() * 320, r() * 320, .8 + r() * 1.6, .8 + r() * 1.6); }
  g.lineWidth = .8; for (let i = 0; i < 220; i++) { g.strokeStyle = `rgba(120,110,90,${.06 + r() * .1})`; const x = r() * 320, y = r() * 320, a = r() * TAU, l = 3 + r() * 11; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  return c;
})();
// coarse halftone: dot radius follows dark(x,y) in [0,1]; rotated screen like a printed photo
function halftone(g, bb, { dark, step = 10, ang = .785, col = C.ink, jitter = 0, seed = 1 }) {
  const [x0, y0, x1, y1] = bb, r = rng(seed), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + step, ca = Math.cos(ang), sa = Math.sin(ang);
  g.fillStyle = col; g.beginPath();
  for (let u = -R; u <= R; u += step) for (let v = -R; v <= R; v += step) {
    const x = cx + u * ca - v * sa, y = cy + u * sa + v * ca;
    if (x < x0 - step || x > x1 + step || y < y0 - step || y > y1 + step) continue;
    let d = dark(x, y); if (jitter) d += (r() - .5) * jitter; if (d <= .03) continue; d = Math.min(d, 1);
    const rad = step * .62 * Math.sqrt(d); g.moveTo(x + rad, y); g.arc(x, y, rad, 0, TAU);
  }
  g.fill();
}
// the collage primitive: hard shadow, white scissor border, paper, halftone, grain
function piece(g, pts, o = {}) {
  const { fill = C.paper, border = 0, bcol = C.white, shadow = null, ht = null, grain = .5, edge = null } = o;
  const p = poly(pts), bb = bbox(pts);
  g.save(); g.lineJoin = 'miter'; g.miterLimit = 5;
  if (shadow) { g.save(); g.translate(shadow[0], shadow[1]); g.fillStyle = `rgba(20,15,10,${shadow[2]})`; g.strokeStyle = g.fillStyle; if (border) { g.lineWidth = border * 2; g.stroke(p); } g.fill(p); g.restore(); }
  if (border) { g.lineWidth = border * 2; g.strokeStyle = bcol; g.stroke(p); }
  g.fillStyle = fill; g.fill(p);
  if (ht || grain) {
    g.save(); g.clip(p);
    if (ht) halftone(g, bb, ht);
    if (grain) { g.globalAlpha = grain; g.globalCompositeOperation = 'multiply'; g.fillStyle = GRAINP; g.fillRect(bb[0] - 2, bb[1] - 2, bb[2] - bb[0] + 4, bb[3] - bb[1] + 4); }
    g.restore();
  }
  if (edge) { g.strokeStyle = edge; g.lineWidth = 1.2; g.stroke(p); }
  g.restore();
}
// a straight strip of cut paper from a to b (arms, legs, brows, speed lines)
function strip(c, a, b, w, seed, col = C.ink, border = 3, shadow = true) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy * w / 2, ny = ux * w / 2, r = rng(seed), e = () => (r() - .5) * w * .9;
  const e1 = e(), e2 = e(), e3 = e(), e4 = e();
  const pts = [[a[0] + nx + ux * e1, a[1] + ny + uy * e1], [b[0] + nx + ux * e2, b[1] + ny + uy * e2], [b[0] - nx + ux * e3, b[1] - ny + uy * e3], [a[0] - nx + ux * e4, a[1] - ny + uy * e4]];
  piece(c, pts, { fill: col, border, shadow: shadow ? [4, 5, .35] : null, grain: 0 });
}
function tapeP(g, x, y, w, h, rot, seed) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const r = rng(seed), pts = [];
  for (let i = 0; i <= 5; i++) pts.push([w / 2 + (i % 2 ? 4 : -2) + r() * 2, -h / 2 + i / 5 * h]);
  for (let i = 5; i >= 0; i--) pts.push([-w / 2 + (i % 2 ? -4 : 2) - r() * 2, -h / 2 + i / 5 * h]);
  const p = poly(pts); g.fillStyle = 'rgba(236,233,214,.62)'; g.fill(p);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1; g.stroke(p);
  g.restore();
}
// fake newspaper body text: rows of grey word-bars, right aligned (Hebrew)
function textBars(g, x0, y0, x1, y1, seed, o = {}) {
  const { lh = 15, bh = 6, col = 'rgba(55,50,44,.32)', para = .14 } = o, r = rng(seed);
  g.fillStyle = col;
  for (let y = y0; y < y1 - bh;) {
    const last = r() < para, end = last ? x0 + (x1 - x0) * (.25 + r() * .5) : x0;
    for (let x = x1; x > end + 4;) { const w = 8 + r() * 40, xs = Math.max(end, x - w); g.fillRect(xs, y, x - xs, bh); x = xs - 5 - r() * 3; }
    y += lh; if (last) y += lh * .5;
  }
}
// per-drawing hand-placement jitter
function jit(c, seed, a = 1.8, rr = .014) { const q = rng(seed * 7919 + DRAW * 104729 + 13); c.translate((q() - .5) * 2 * a, (q() - .5) * 2 * a); c.rotate((q() - .5) * 2 * rr); }
// sprites
function sprite(w, h, ax, ay, fn) { const cvs = mkCanvas(Math.ceil(w * S), Math.ceil(h * S)), g = cvs.getContext('2d'); g.setTransform(S, 0, 0, S, 0, 0); g.translate(ax, ay); fn(g); return { cv: cvs, w, h, ax, ay }; }
function blit(c, sp) { c.drawImage(sp.cv, -sp.ax, -sp.ay, sp.w, sp.h); }
function txt(g, str, x, y, font, col, align = 'center') { g.save(); g.font = font; g.direction = 'rtl'; g.textAlign = align; g.textBaseline = 'alphabetic'; const m = g.measureText(str); g.fillStyle = col; g.fillText(str, x, y + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2); g.restore(); return m.width; }

// ============================================================
// SPRITES built once
// ============================================================
let L_PAGE, SP_PANEL, SP_BODY, SP_STAR, SP_BURST_R, SP_BURST_Y, SP_BLK = [], SP_SPLAT, SP_BOOM, SP_BANG, TITLE_CHIPS = [];
const BODYP = cutPoly(BODY.rx, BODY.ry, 15, 7, .045);
function buildPage() {
  L_PAGE = layer(g => {
    g.translate(PM, PM);
    g.fillStyle = C.paper; g.fillRect(-PM, -PM, W + PM * 2, H + PM * 2);
    // uneven newsprint: yellowing + grain
    const r = rng(5);
    for (let i = 0; i < 7; i++) { const x = r() * W, y = r() * H, rad = 250 + r() * 500, gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(190,170,120,${.05 + r() * .06})`); gr.addColorStop(1, 'rgba(190,170,120,0)'); g.fillStyle = gr; g.fillRect(-PM, -PM, W + PM * 2, H + PM * 2); }
    g.save(); g.globalAlpha = .7; g.globalCompositeOperation = 'multiply'; g.fillStyle = GRAINP; g.fillRect(-PM, -PM, W + PM * 2, H + PM * 2); g.restore();
    // masthead
    txt(g, 'גיליון 02 · יום ראשון', 1032, 60, '600 27px Heebo', C.ink, 'right');
    txt(g, 'המחיר: עוד ניסיון אחד', 48, 60, '600 27px Heebo', C.ink, 'left');
    g.fillStyle = C.ink; g.fillRect(48, 84, 984, 3);
    g.save(); g.font = '900 170px Heebo'; const mw = g.measureText('יומן נפילות').width; g.restore();
    const ms = Math.min(1, 960 / mw);
    g.save(); g.translate(540, 172); g.scale(ms, 1); txt(g, 'יומן נפילות', 0, 0, '900 170px Heebo', C.ink); g.restore();
    g.fillRect(48, 256, 984, 6); g.fillRect(48, 268, 984, 2);
    txt(g, 'הכל על הנפילה הבאה · מדור ספורט · מזג אוויר: כוכבים', 540, 292, '500 25px Heebo', '#3a352e');
    g.fillRect(48, 312, 984, 2);
    // four columns of body text, headlines and photo boxes
    const colW = (984 - 3 * 26) / 4;
    for (let k = 0; k < 4; k++) {
      const x1 = 1032 - k * (colW + 26), x0 = x1 - colW, q = rng(100 + k);
      if (k) { g.fillStyle = 'rgba(40,36,30,.35)'; g.fillRect(x1 + 12, 334, 1.5, GY - 360); }
      let y = 336 + q() * 20;
      while (y < GY - 60) {
        const roll = q();
        if (roll < .22) { g.fillStyle = 'rgba(25,22,18,.62)'; for (let l = 0; l < 2; l++) { let x = x1; while (x > x0 + (l ? 60 + q() * 60 : 0)) { const w = 30 + q() * 60, xs = Math.max(x0, x - w); g.fillRect(xs, y, x - xs, 20); x = xs - 10; } y += 30; } y += 10; }
        else if (roll < .42) { const h = 120 + q() * 150, hy = y, sd = 200 + k * 10 + (y | 0);
          g.save(); g.beginPath(); g.rect(x0, hy, colW, h); g.clip(); g.fillStyle = 'rgba(200,192,175,.5)'; g.fillRect(x0, hy, colW, h);
          halftone(g, [x0, hy, x1, hy + h], { dark: (x, yy) => .28 + .22 * Math.sin(x * .03 + sd) * Math.cos(yy * .025 + sd * .7) + .25 * ((yy - hy) / h), step: 8, col: 'rgba(38,34,30,.55)', seed: sd }); g.restore();
          g.strokeStyle = 'rgba(30,26,22,.4)'; g.lineWidth = 1.2; g.strokeRect(x0, hy, colW, h); y += h + 8; textBars(g, x0 + colW * .3, y, x1, y + 12, sd, { lh: 12, bh: 4, col: 'rgba(55,50,44,.45)', para: 0 }); y += 22; }
        else { const h = 120 + q() * 220; textBars(g, x0, y, x1, Math.min(y + h, GY - 40), 300 + k * 50 + (y | 0)); y += h + 16; }
      }
    }
    // fold crease
    const fg = g.createLinearGradient(530, 0, 552, 0); fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(.5, 'rgba(60,45,20,.13)'); fg.addColorStop(.52, 'rgba(255,255,255,.25)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = fg; g.fillRect(530, -PM, 22, H + PM * 2);
    // the big red poster sheet behind the star
    const sheet = [[176, 380], [640, 366], [906, 352], [930, 700], [912, 992], [420, 1000], [160, 1012], [150, 690]];
    piece(g, sheet, { fill: C.red, shadow: [14, 16, .42], grain: .45,
      ht: { step: 13, ang: .26, col: 'rgba(22,14,10,.85)', seed: 31, jitter: .06,
        dark: (x, y) => clamp((y - 560) / 440) * .72 + .1 * Math.sin(x * .012) - .35 * Math.exp(-((x - 540) ** 2 + (y - 640) ** 2) / 50000) } });
    // cut halftone "moon" photo top-right of the sheet
    g.save(); g.translate(790, 470);
    piece(g, cutPoly(62, 62, 11, 44, .04), { fill: C.paperL, border: 5, shadow: [7, 8, .45], ht: { step: 7, col: C.ink, seed: 45, dark: (x, y) => clamp(.1 + (x + y) / 200 + .12 * Math.sin(x * .2) * Math.cos(y * .17)) } });
    g.restore();
    tapeP(g, 190, 385, 120, 36, -.7, 51); tapeP(g, 895, 362, 120, 36, .68, 52);
    // "exclusive!" snipe
    g.save(); g.translate(250, 395); g.rotate(-.2);
    piece(g, cutRect(190, 64, 61, 4), { fill: C.yel, shadow: [6, 7, .45], grain: .35 });
    txt(g, 'בלעדי!', 0, 2, '900 46px Heebo', C.ink); g.restore();
    // red dots stickers + black arrow scraps on the page
    [[96, 1180], [990, 1120], [1010, 1390]].forEach(([x, y], i) => { g.save(); g.translate(x, y); piece(g, cutPoly(22, 22, 8, 70 + i), { fill: i === 1 ? C.yel : C.red, shadow: [4, 5, .4], grain: .3 }); g.restore(); });
    // ground: black cut paper with a light halftone "floor photo"
    const gpts = [[-PM - 10, GY - 4], [260, GY + 5], [600, GY - 5], [W + PM + 10, GY + 7], [W + PM + 10, H + PM + 10], [-PM - 10, H + PM + 10]];
    piece(g, gpts, { fill: '#1c1a17', border: 6, grain: .15,
      ht: { step: 12, ang: .785, col: '#77726a', seed: 91, jitter: .1, dark: (x, y) => clamp(.62 - (y - GY) / 380 + .08 * Math.sin(x * .02)) } });
    // continued on page 2 (ransom caption)
    const cap = [['המשך', C.paperL, C.ink, '800 44px Heebo', -.05], ['בעמוד', C.red, C.white, '900 44px Heebo', .06], ['2', C.yel, C.ink, '900 52px Heebo', -.08]];
    let cx = 1010;
    cap.forEach(([w, bg, fg2, font, rot], i) => {
      g.save(); g.font = font; const tw = g.measureText(w).width + 36; g.restore();
      g.save(); g.translate(cx - tw / 2, 1810 + (i % 2) * 8); g.rotate(rot);
      piece(g, cutRect(Math.round(tw), 70, 80 + i, 4), { fill: bg, shadow: [5, 6, .5], grain: .3 });
      txt(g, w, 0, 0, font, fg2); g.restore(); cx -= tw + 6;
    });
    tapeP(g, 960, 1784, 70, 26, .5, 88);
  }, W + PM * 2, H + PM * 2);
}
function buildSprites() {
  // פיצי's body: a ball cut from a B/W halftone photo
  SP_BODY = sprite(300, 280, 150, 140, g => {
    const rx = BODY.rx, ry = BODY.ry;
    piece(g, BODYP, { fill: C.paperL, border: 7, shadow: [9, 11, .5], grain: .35,
      ht: { step: 10, ang: .785, col: C.ink, seed: 7, jitter: .08, dark: (x, y) => {
        const nx = x / rx, ny = y / ry, z = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)), di = Math.max(0, -nx * .5 - ny * .62 + z * .6);
        return clamp(Math.pow(1 - di, 2.2) * .8 - .04 + .05 * Math.sin(x * .09) * Math.cos(y * .11)); } } });
  });
  SP_STAR = sprite(280, 280, 140, 140, g => {
    piece(g, starPts(STAR_R, STAR_R * .5, 11), { fill: C.yel, border: 8, shadow: [9, 11, .5], grain: .3,
      ht: { step: 9, ang: .4, col: 'rgba(22,18,12,.9)', seed: 12, dark: (x, y) => clamp((x + y + 40) / 190 * .55) } });
  });
  SP_BURST_R = sprite(820, 820, 410, 410, g => piece(g, burstPts(300, 200, 18, 21), { fill: C.red, border: 8, shadow: [12, 14, .4], grain: .4,
    ht: { step: 14, col: 'rgba(20,12,8,.8)', seed: 22, dark: (x, y) => clamp((Math.hypot(x, y) - 150) / 200) } }));
  SP_BURST_Y = sprite(560, 560, 280, 280, g => piece(g, burstPts(200, 140, 13, 23), { fill: C.yel, border: 5, shadow: [8, 10, .35], grain: .3 }));
  // failure blocks: newspaper clippings with ransom labels
  for (let i = 0; i < 2; i++) SP_BLK[i] = sprite(TOWER.w + 80, TOWER.h + 80, (TOWER.w + 80) / 2, (TOWER.h + 80) / 2, g => {
    const w = TOWER.w, h = TOWER.h, base = i ? C.yel : C.paperL, pts = cutRect(w, h, 301 + i, 5);
    piece(g, pts, { fill: base, border: 6, shadow: [10, 12, .5], grain: .45 });
    g.save(); g.clip(poly(pts));
    g.fillStyle = C.ink; g.fillRect(-w / 2, -h / 2 + 14, w, 3);
    textBars(g, -w / 2 + 14, -h / 2 + 100, w / 2 - 14, h / 2 - 12, 330 + i, { lh: 13, bh: 5, col: 'rgba(30,26,22,.42)' });
    g.restore();
    // halftone snapshot in the clipping
    g.save(); g.translate(62, 58); g.rotate(.04);
    piece(g, cutRect(96, 84, 340 + i, 3), { fill: C.paperL, border: 3, shadow: [4, 5, .4], ht: { step: 6, seed: 341 + i, col: C.ink, dark: (x, y) => clamp(.35 + .3 * Math.sin(x * .09 + i) * Math.cos(y * .12) + y / 120) } });
    g.restore();
    // ransom label "נפילה"
    const L = ['נ', 'פ', 'י', 'ל', 'ה'], fonts = ['900 52px Heebo', '54px OHRonShemer', '300 56px Heebo', '56px OHRonShemer', '800 52px Heebo'],
      cols = i ? [[C.red, C.white], [C.ink, C.yel], [C.white, C.ink], [C.red, C.white], [C.ink, C.white]] : [[C.ink, C.white], [C.red, C.white], [C.white, C.ink], [C.yel, C.ink], [C.ink, C.yel]];
    let x = 104; const q = rng(350 + i);
    L.forEach((ch, k) => {
      const [bg, fg] = cols[k], font = fonts[k];
      g.save(); g.translate(x - 22, -h / 2 + 58 + (q() - .5) * 8); g.rotate((q() - .5) * .22);
      piece(g, cutRect(46, 60, 360 + k + i * 10, 3), { fill: bg, shadow: [3, 4, .45], grain: .25 });
      txt(g, ch, 0, 0, font, fg); g.restore(); x -= 45;
    });
    // the number: big red chip, digit in Heebo
    g.save(); g.translate(-62, 52); g.rotate(-.07 + i * .1);
    piece(g, cutRect(104, 116, 370 + i, 4), { fill: i ? C.ink : C.red, border: 5, shadow: [6, 7, .5], grain: .3 });
    txt(g, BLOCKS[i].n, 0, 2, '900 112px Heebo', i ? C.yel : C.white); g.restore();
  });
